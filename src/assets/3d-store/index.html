<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfin 3D Store</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0d; /* Dark theme default */
            color: #f4f1ea;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        #hud {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 20;
            background: #4b0082; /* Purple */
            border: 4px solid #FDDA0D; /* Yellow */
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #hud.show {
            display: block;
        }
        #hud-title {
            margin: 0 0 15px 0;
            font-size: 24px;
            font-weight: 800;
            font-style: italic;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #hud-play {
            background: #FDDA0D;
            color: #4b0082;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: transform 0.1s, background 0.2s;
        }
        #hud-play:hover {
            background: #fff04d;
            transform: scale(1.05);
        }
        #hud-play:active {
            transform: scale(0.95);
        }
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b0b0d;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <h3 id="loading-text">Loading shelves...</h3>
    </div>

    <div id="hud">
        <h2 id="hud-title">Title</h2>
        <button id="hud-play">Play</button>
    </div>

    <script type="module">
        import * as THREE from './vendor/three.module.min.js';

        // 1. Handshake Logic
        let jfToken = null;
        let jfServer = null;
        let jfUserId = null;

        // Tell the parent we are ready to receive the auth token
        parent.postMessage({ type: 'READY' }, '*');

        window.addEventListener('message', (event) => {
            // In a real prod setup, validate event.origin here.
            // For now we accept the token.
            if (event.data && event.data.type === 'AUTH') {
                jfToken = event.data.payload.token;
                jfServer = event.data.payload.serverUrl;
                jfUserId = event.data.payload.userId;
                console.log("3D Store received AUTH. Token:", jfToken ? "Present" : "Missing", "Server:", jfServer, "User:", jfUserId);
                init3D();
            } else if (event.data && event.data.type === 'SEERR_DATA') {
                console.log("Received Seerr Data", event.data.payload);
            }
        });

        // 2. Three.js Setup (Triggered after Auth)
        let cleanup3D = () => {};

        // HUD Elements
        const hud = document.getElementById('hud');
        const hudTitle = document.getElementById('hud-title');
        const hudPlay = document.getElementById('hud-play');
        const loadingScreen = document.getElementById('loading-screen');
        let selectedItem = null;

        async function init3D() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8.5, 14);
            // Initial tilt will be set by cameraPitch in the state block

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // Standard "Retail" Lighting (Bright and even)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const overheadLight = new THREE.DirectionalLight(0xffffff, 0.8);
            overheadLight.position.set(0, 8, 3);
            scene.add(overheadLight);

            // Procedural Carpet Texture (90s Arcade / Cinema)
            function createFloorTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // Dark indigo base
                ctx.fillStyle = '#161625';
                ctx.fillRect(0, 0, 512, 512);

                // Static noise to simulate carpet threads
                const imgData = ctx.getImageData(0, 0, 512, 512);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 35;
                    data[i] = Math.max(0, Math.min(255, data[i] + noise));
                    data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise));
                    data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise));
                }
                ctx.putImageData(imgData, 0, 0);

                // Neon 90s specks
                const colors = ['#e94560', '#6C63FF', '#00d2ff', '#FF6584'];
                for (let i = 0; i < 3000; i++) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(15, 15);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                return tex;
            }

            // Procedural Drop Ceiling Texture (with 2x4 Fluorescent Lights)
            function createCeilingTexture() {
                const TILE_SIZE = 512;
                const canvas = document.createElement('canvas');
                canvas.width = TILE_SIZE * 3;  // 1536 (3x3 grid of tiles)
                canvas.height = TILE_SIZE * 3; // 1536
                const ctx = canvas.getContext('2d');
                
                // Base white color
                ctx.fillStyle = '#eeeeee';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Helper to draw acoustic dots
                function drawAcoustic(x, y) {
                    ctx.fillStyle = 'rgba(0,0,0,0.1)';
                    for (let i=0; i < 1500; i++) {
                        ctx.fillRect(x + Math.random() * TILE_SIZE, y + Math.random() * TILE_SIZE, 3, 3);
                    }
                }
                
                ctx.strokeStyle = '#aaaaaa';
                ctx.lineWidth = 12;
                
                // Draw the 9 grid squares
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        const x = c * TILE_SIZE;
                        const y = r * TILE_SIZE;
                        ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                        
                        // Don't draw acoustic dots on the fluorescent light!
                        if (!(r === 1 && (c === 1 || c === 2))) {
                            drawAcoustic(x, y);
                        }
                    }
                }
                
                // Draw the 2-tile-length Rectangular Fluorescent Light! (Row 1, Cols 1 & 2)
                const lightX = TILE_SIZE; 
                const lightY = TILE_SIZE;
                const lightW = TILE_SIZE * 2;
                const lightH = TILE_SIZE;
                
                // Metal frame around the light
                ctx.fillStyle = '#dddddd';
                ctx.fillRect(lightX + 10, lightY + 10, lightW - 20, lightH - 20);
                ctx.strokeStyle = '#888888';
                ctx.lineWidth = 4;
                ctx.strokeRect(lightX + 10, lightY + 10, lightW - 20, lightH - 20);
                
                // Glowing diffuser lens
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(lightX + 25, lightY + 25, lightW - 50, lightH - 50);
                
                // Diffuser grid pattern
                ctx.strokeStyle = '#f8f8f8';
                ctx.lineWidth = 2;
                for (let i = lightX + 25; i < lightX + lightW - 25; i += 12) {
                    ctx.beginPath(); ctx.moveTo(i, lightY + 25); ctx.lineTo(i, lightY + lightH - 25); ctx.stroke();
                }
                for (let i = lightY + 25; i < lightY + lightH - 25; i += 12) {
                    ctx.beginPath(); ctx.moveTo(lightX + 25, i); ctx.lineTo(lightX + lightW - 25, i); ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(5, 6.66); 
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                
                // Create Emissive Map (Pitch black except for the light lens)
                const emCanvas = document.createElement('canvas');
                emCanvas.width = canvas.width; emCanvas.height = canvas.height;
                const emCtx = emCanvas.getContext('2d');
                emCtx.fillStyle = '#000000';
                emCtx.fillRect(0, 0, emCanvas.width, emCanvas.height);
                emCtx.fillStyle = '#ffffff'; // The part that will glow
                emCtx.fillRect(lightX + 25, lightY + 25, lightW - 50, lightH - 50);
                // Draw the diffuser grid in black so the grid lines don't glow!
                emCtx.strokeStyle = '#000000';
                emCtx.lineWidth = 2;
                for (let i = lightX + 25; i < lightX + lightW - 25; i += 12) {
                    emCtx.beginPath(); emCtx.moveTo(i, lightY + 25); emCtx.lineTo(i, lightY + lightH - 25); emCtx.stroke();
                }
                for (let i = lightY + 25; i < lightY + lightH - 25; i += 12) {
                    emCtx.beginPath(); emCtx.moveTo(lightX + 25, i); emCtx.lineTo(lightX + lightW - 25, i); emCtx.stroke();
                }
                const emTex = new THREE.CanvasTexture(emCanvas);
                emTex.wrapS = THREE.RepeatWrapping; emTex.wrapT = THREE.RepeatWrapping;
                emTex.repeat.set(5, 6.66);
                emTex.colorSpace = THREE.LinearSRGBColorSpace;
                emTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

                return { map: tex, emissiveMap: emTex };
            }

            // Physical Store Room
            // Floor
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({
                map: createFloorTexture(),
                roughness: 0.8,
                metalness: 0.0
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, -1.49, 0);
            scene.add(floor);

            // Walls and Ceiling
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xFF9E1B, roughness: 0.9, side: THREE.BackSide }); // Orange-Yellow
            
            const ceilingTextures = createCeilingTexture();
            const ceilingMat = new THREE.MeshStandardMaterial({ 
                map: ceilingTextures.map, 
                emissiveMap: ceilingTextures.emissiveMap,
                emissive: 0xfff0d0, // Warm orangish-yellow 90s bulb tint!
                emissiveIntensity: 1.2,
                roughness: 1.0, 
                side: THREE.BackSide 
            });
            // BoxGeometry materials: Right, Left, Top, Bottom, Front, Back
            const roomMats = [wallMat, wallMat, ceilingMat, wallMat, wallMat, wallMat];

            // Raised ceiling slightly to give the exit sign more breathing room
            const wallsGeo = new THREE.BoxGeometry(60, 17.2, 65);
            const walls = new THREE.Mesh(wallsGeo, roomMats);
            walls.position.set(0, 7.1, 0);
            scene.add(walls);

            // --- Exit Doorway ---
            const doorGroup = new THREE.Group();
            doorGroup.position.set(0, 5.3, 32.4); // Placed flush against the front wall
            doorGroup.scale.set(1.44, 1.6, 1.6); // Made 10% thinner to leave room for wall posters

            // Stylized Comic-Book Glass Texture
            function createGlassTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                // Light sky blue base
                ctx.fillStyle = '#9bd4f5';
                ctx.fillRect(0, 0, 512, 1024);

                // Diagonal shines (Bottom-Left to Top-Right)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';

                // Thick stripe
                ctx.beginPath();
                ctx.moveTo(0, 800); ctx.lineTo(512, 100);
                ctx.lineTo(512, 400); ctx.lineTo(0, 1100);
                ctx.fill();

                // Thin stripe
                ctx.beginPath();
                ctx.moveTo(0, 400); ctx.lineTo(512, -300);
                ctx.lineTo(512, -150); ctx.lineTo(0, 550);
                ctx.fill();

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.4 });
            const glassMat = new THREE.MeshBasicMaterial({ map: createGlassTexture() });

            // Hollow Outer Frame
            const frameSideGeo = new THREE.BoxGeometry(0.5, 8.5, 0.4);
            const frameTopGeo = new THREE.BoxGeometry(10.5, 0.5, 0.4);
            const outerL = new THREE.Mesh(frameSideGeo, frameMat); outerL.position.set(-5, 0, 0); doorGroup.add(outerL);
            const outerR = new THREE.Mesh(frameSideGeo, frameMat); outerR.position.set(5, 0, 0); doorGroup.add(outerR);
            const outerT = new THREE.Mesh(frameTopGeo, frameMat); outerT.position.set(0, 4, 0); doorGroup.add(outerT);
            const outerB = new THREE.Mesh(frameTopGeo, frameMat); outerB.position.set(0, -4, 0); doorGroup.add(outerB);

            // Glass Panel Geo
            const glassGeo = new THREE.BoxGeometry(4.6, 7.8, 0.1);
            const innerSideGeo = new THREE.BoxGeometry(0.2, 8, 0.2);
            const innerTopGeo = new THREE.BoxGeometry(5, 0.2, 0.2);
            const barGeo = new THREE.BoxGeometry(4.6, 0.1, 0.15);

            // Left Sliding Door
            const leftDoor = new THREE.Group();
            leftDoor.position.set(-2.4, -0.1, -0.05);
            leftDoor.add(new THREE.Mesh(glassGeo, glassMat));

            const lFrameL = new THREE.Mesh(innerSideGeo, frameMat); lFrameL.position.set(-2.4, 0, 0); leftDoor.add(lFrameL);
            const lFrameR = new THREE.Mesh(innerSideGeo, frameMat); lFrameR.position.set(2.4, 0, 0); leftDoor.add(lFrameR);
            const lFrameT = new THREE.Mesh(innerTopGeo, frameMat); lFrameT.position.set(0, 3.9, 0); leftDoor.add(lFrameT);
            const lFrameB = new THREE.Mesh(innerTopGeo, frameMat); lFrameB.position.set(0, -3.9, 0); leftDoor.add(lFrameB);
            const lBar = new THREE.Mesh(barGeo, frameMat); lBar.position.set(0, -0.5, 0); leftDoor.add(lBar);
            doorGroup.add(leftDoor);

            // Right Sliding Door
            const rightDoor = new THREE.Group();
            rightDoor.position.set(2.4, -0.1, 0.05); // Offset Z slightly for sliding overlap
            rightDoor.add(new THREE.Mesh(glassGeo, glassMat));

            const rFrameL = new THREE.Mesh(innerSideGeo, frameMat); rFrameL.position.set(-2.4, 0, 0); rightDoor.add(rFrameL);
            const rFrameR = new THREE.Mesh(innerSideGeo, frameMat); rFrameR.position.set(2.4, 0, 0); rightDoor.add(rFrameR);
            const rFrameT = new THREE.Mesh(innerTopGeo, frameMat); rFrameT.position.set(0, 3.9, 0); rightDoor.add(rFrameT);
            const rFrameB = new THREE.Mesh(innerTopGeo, frameMat); rFrameB.position.set(0, -3.9, 0); rightDoor.add(rFrameB);
            const rBar = new THREE.Mesh(barGeo, frameMat); rBar.position.set(0, -0.5, 0); rightDoor.add(rBar);
            doorGroup.add(rightDoor);

            // Decals
            function createDecalTex(text1, text2, bgColor) {
                const c = document.createElement('canvas'); c.width = 256; c.height = 256;
                const ctx = c.getContext('2d');
                ctx.fillStyle = bgColor; ctx.fillRect(20,20,216,216);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10; ctx.strokeRect(30,30,196,196);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px "Helvetica Neue", sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(text1, 128, 110); ctx.fillText(text2, 128, 160);
                const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
            }
            const decalGeo = new THREE.PlaneGeometry(1, 1);
            const decal1Mat = new THREE.MeshBasicMaterial({ map: createDecalTex('BE KIND', 'REWIND', '#e94560'), transparent: true, side: THREE.DoubleSide });
            const decal2Mat = new THREE.MeshBasicMaterial({ map: createDecalTex('NO FOOD', 'OR DRINK', '#0f3460'), transparent: true, side: THREE.DoubleSide });

            const decal1 = new THREE.Mesh(decalGeo, decal1Mat); decal1.position.set(0, 1.5, -0.06); decal1.rotation.y = Math.PI; leftDoor.add(decal1);
            const decal2 = new THREE.Mesh(decalGeo, decal2Mat); decal2.position.set(0, 1.5, -0.06); decal2.rotation.y = Math.PI; rightDoor.add(decal2);

            // Glowing Exit Sign (Red Canvas)
            const exitCanvas = document.createElement('canvas');
            exitCanvas.width = 256; exitCanvas.height = 128;
            const exitCtx = exitCanvas.getContext('2d');
            exitCtx.fillStyle = '#ff0000'; exitCtx.fillRect(0,0,256,128);
            exitCtx.fillStyle = '#ffffff'; exitCtx.font = 'bold 70px "Helvetica Neue", sans-serif'; exitCtx.textAlign = 'center';
            exitCtx.fillText('EXIT', 128, 90);
            const exitTex = new THREE.Texture(exitCanvas); exitTex.needsUpdate = true;

            const exitSignGeo = new THREE.BoxGeometry(3, 1.2, 0.3);
            const exitSignMat = new THREE.MeshStandardMaterial({
                map: exitTex,
                emissiveMap: exitTex,
                emissive: 0xff0000, // Red glow
                emissiveIntensity: 0.8,
                color: 0xffffff
            });
            const exitSign = new THREE.Mesh(exitSignGeo, exitSignMat);
            exitSign.position.set(0, 5, 0);
            doorGroup.add(exitSign);

            // Add a red PointLight so the exit sign physically casts red light onto the floor and doors!
            const exitLight = new THREE.PointLight(0xff0000, 0.6, 15);
            exitLight.position.set(0, 4.5, -1);
            doorGroup.add(exitLight);

            scene.add(doorGroup);

            const interactableMeshes = [];

            // Invisible HitBox so the entire doorway is perfectly clickable
            const hitBoxGeo = new THREE.BoxGeometry(10, 8, 1);
            const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
            const doorsHitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
            doorsHitBox.position.set(0, 0, 0);
            doorsHitBox.userData = { isExit: true };
            doorGroup.add(doorsHitBox);
            interactableMeshes.push(doorsHitBox);

            // Polyfill for CanvasRenderingContext2D.roundRect
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + r, y, r);
                this.closePath();
                return this;
            }

            function createBackCoverTexture(item, palette) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 768; // 1:1.5 ratio
                const ctx = canvas.getContext('2d');

                if (!palette) palette = { bg: '#1c1c1e', text: '#ffffff', subtext: '#cccccc', divider: '#333333' };

                // Base Background
                ctx.fillStyle = palette.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Blockbuster-style Top Header Bar
                ctx.fillStyle = '#0000aa'; // Blue bar
                ctx.fillRect(0, 0, canvas.width, 40);
                ctx.fillStyle = '#ffcc00'; // Yellow text
                ctx.font = 'bold 20px "Arial Black", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GUARANTEED TO BE THERE', canvas.width / 2, 28);

                // MPAA Rating Box (Top Right)
                const rating = item.OfficialRating || 'NR';
                ctx.font = 'bold 22px "Arial Black", sans-serif';
                // Measure the text and pad it nicely
                const ratingWidth = Math.max(52, ctx.measureText(rating).width + 20);
                const boxRight = canvas.width - 30; // 30px margin from right
                const boxLeft = boxRight - ratingWidth;
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(boxLeft - 4, 60, ratingWidth + 8, 45);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.strokeRect(boxLeft, 64, ratingWidth, 37);
                
                ctx.fillStyle = '#000000';
                ctx.textAlign = 'center';
                ctx.fillText(rating, boxLeft + ratingWidth / 2, 93);

                // Title
                ctx.fillStyle = palette.text;
                ctx.font = 'bold 44px "Helvetica Neue", sans-serif';
                ctx.textAlign = 'left';

                function wrapText(context, text, x, y, maxWidth, lineHeight, maxLines = 10) {
                    if (!text) return y;
                    const words = text.split(' ');
                    let line = '';
                    let currentY = y;
                    let lines = 0;

                    for (let n = 0; n < words.length; n++) {
                        const testLine = line + words[n] + ' ';
                        const metrics = context.measureText(testLine);
                        const testWidth = metrics.width;
                        if (testWidth > maxWidth && n > 0) {
                            context.fillText(line, x, currentY);
                            line = words[n] + ' ';
                            currentY += lineHeight;
                            lines++;
                            if (lines >= maxLines) {
                                context.fillText('...', x, currentY);
                                return currentY + lineHeight;
                            }
                        } else {
                            line = testLine;
                        }
                    }
                    context.fillText(line, x, currentY);
                    return currentY + lineHeight;
                }

                let yPos = 100; // Below header
                // Title wraps but avoids the rating box!
                yPos = wrapText(ctx, item.Name || 'Unknown Title', 30, yPos, canvas.width - 120, 50, 3);

                // Meta info
                ctx.font = '22px "Helvetica Neue", sans-serif';
                ctx.fillStyle = palette.subtext;
                const year = item.ProductionYear || '----';
                let runtime = '';
                if (item.RunTimeTicks) {
                    const mins = Math.floor(item.RunTimeTicks / 600000000);
                    const h = Math.floor(mins / 60);
                    const m = mins % 60;
                    runtime = h > 0 ? `${h}h ${m}m` : `${m}m`;
                }
                const genre = (item.Genres && item.Genres.length > 0) ? item.Genres[0] : '';
                ctx.fillText(`${year}  ·  ${runtime}  ${genre ? '·  ' + genre : ''}`, 30, yPos + 10);
                yPos += 50;

                // Divider
                ctx.strokeStyle = palette.divider;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(30, yPos); ctx.lineTo(canvas.width - 30, yPos); ctx.stroke();
                yPos += 40;

                // Synopsis Header
                ctx.fillStyle = '#f5c518';
                ctx.font = 'bold 16px "Helvetica Neue", sans-serif';
                ctx.fillText('S Y N O P S I S', 30, yPos);
                yPos += 40;

                // Synopsis Body
                ctx.fillStyle = palette.text;
                ctx.font = '22px "Helvetica Neue", sans-serif';
                yPos = wrapText(ctx, item.Overview || 'No synopsis available.', 30, yPos, canvas.width - 60, 32, 10);

                // --- Bottom Graphics ---
                const bottomY = canvas.height - 100;

                // 1. Procedural UPC Barcode (Bottom Left)
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(30, bottomY, 140, 70);
                ctx.fillStyle = '#000000';
                let currentX = 40;
                for(let i=0; i<30; i++) {
                    const barW = Math.random() > 0.6 ? 4 : 2; // Random thin/thick bars
                    if (currentX + barW > 160) break;
                    ctx.fillRect(currentX, bottomY + 10, barW, 40);
                    currentX += barW + (Math.random() * 3 + 1);
                }
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('4  39120  48291  8', 100, bottomY + 65);

                // 2. VHS / Hi-Fi Stereo Tech Logos (Bottom Center)
                ctx.fillStyle = palette.subtext;
                ctx.font = 'bold 18px "Arial", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('VHS', 230, bottomY + 30);
                ctx.font = '12px "Arial", sans-serif';
                ctx.fillText('Hi-Fi STEREO', 230, bottomY + 50);

                // 3. Rental Sticker (Bottom Right)
                ctx.fillStyle = '#111111';
                ctx.roundRect(canvas.width - 200, bottomY, 170, 70, 10);
                ctx.fill();
                ctx.strokeStyle = '#f5c518';
                ctx.lineWidth = 2;
                ctx.roundRect(canvas.width - 195, bottomY + 5, 160, 60, 6);
                ctx.stroke();

                ctx.fillStyle = '#f5c518';
                ctx.font = 'bold 14px "Helvetica Neue", sans-serif';
                ctx.fillText('RENTAL COPY', canvas.width - 115, bottomY + 38);
                ctx.fillStyle = '#aaaaaa';
                ctx.font = '12px "Helvetica Neue", sans-serif';
                ctx.fillText('Please Rewind', canvas.width - 115, bottomY + 56);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            function createSpineTexture(item, palette) {
                const canvas = document.createElement('canvas');
                canvas.width = 64; // Aspect ratio 0.10 to 1.5 is 1:15 (64x960)
                canvas.height = 960;
                const ctx = canvas.getContext('2d');

                if (!palette) palette = { bg: '#1c1c1e', text: '#ffffff', subtext: '#cccccc', divider: '#333333' };

                // Background
                ctx.fillStyle = palette.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Sticker at Top
                ctx.fillStyle = '#f5c518'; // Yellow
                ctx.fillRect(0, 0, canvas.width, 100);

                // Sticker Text (Rotated slightly or stacked)
                ctx.fillStyle = '#111111';
                ctx.font = 'bold 14px "Helvetica Neue", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('SHELF', canvas.width / 2, 40);
                ctx.fillText('COPY', canvas.width / 2, 60);

                // Spine Title (Rotated 90 degrees)
                ctx.save();
                ctx.translate(canvas.width / 2, 160); // Start below the sticker
                ctx.rotate(Math.PI / 2); // Rotate 90 degrees clockwise

                ctx.fillStyle = palette.text;
                ctx.font = 'bold 36px "Helvetica Neue", sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                // Truncate if too long (roughly 750px width available when rotated)
                let title = item.Name || 'Unknown Title';
                if (ctx.measureText(title).width > 750) {
                    while (ctx.measureText(title + '...').width > 750 && title.length > 0) {
                        title = title.substring(0, title.length - 1);
                    }
                    title += '...';
                }

                ctx.fillText(title, 0, 0);
                ctx.restore();

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            // Simple semaphore to limit concurrent operations
            class Semaphore {
                constructor(max) {
                    this.max = max;
                    this.current = 0;
                    this.queue = [];
                }

                async acquire() {
                    if (this.current < this.max) {
                        this.current++;
                        return Promise.resolve();
                    }
                    return new Promise(resolve => this.queue.push(resolve));
                }

                release() {
                    this.current--;
                    if (this.queue.length > 0) {
                        this.current++;
                        this.queue.shift()();
                    }
                }
            }

            // Optimized for Cloudflare HTTP/2 multiplexing in production
            const textureSemaphore = new Semaphore(100);
            const textureCache = new Map();

            // Helper to fetch images and extract average color
            // Helper to fetch images and extract average color
            function loadTexture(itemId) {
                // Return the promise immediately if it's already in the cache
                if (textureCache.has(itemId)) {
                    return textureCache.get(itemId);
                }

                // Create the promise and store it in the cache BEFORE awaiting anything!
                // This prevents duplicate concurrent fetches for the same movie across different shelves.
                const promise = (async () => {
                    await textureSemaphore.acquire();

                    try {
                        const imgUrl = `${jfServer}/Items/${itemId}/Images/Primary?maxWidth=256&quality=80`;
                        const imgRes = await fetch(imgUrl, { headers: { 'X-Emby-Token': jfToken } });
                        if (!imgRes.ok) return null;
                        const blob = await imgRes.blob();
                        const bmp = await createImageBitmap(blob, { imageOrientation: 'flipY' });

                        const tex = new THREE.Texture(bmp);
                        tex.colorSpace = THREE.SRGBColorSpace;
                        tex.needsUpdate = true;

                        return { texture: tex, bitmap: bmp };
                    } catch (e) {
                        return null;
                    } finally {
                        textureSemaphore.release();
                    }
                })();

                textureCache.set(itemId, promise);
                return promise;
            }
            // Start loading data in the background without blocking the render loop
            loadData().catch(e => console.error(e));
        async function loadData() {
            try {
                const extractItems = (d) => Array.isArray(d) ? d : (d.Items || []);
                const fields = 'Overview,RunTimeTicks,ProductionYear,OfficialRating,Genres';

                function shuffleArray(array) {
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                    return array;
                }

                // Fetch 15 distinct categories for our massive structures
                const categories = [
                    { name: 'Action', genre: 'Action', sort: 'SortName', randomizeWindow: true },
                    { name: 'Comedy', genre: 'Comedy', sort: 'SortName', randomizeWindow: true },
                    { name: 'Drama', genre: 'Drama', sort: 'SortName', randomizeWindow: true },
                    { name: 'Sci-Fi', genre: 'Sci-Fi', sort: 'SortName', randomizeWindow: true },
                    { name: 'Horror', genre: 'Horror', sort: 'SortName', randomizeWindow: true },
                    { name: 'Family', genre: 'Family', sort: 'SortName', randomizeWindow: true },
                    { name: 'Thriller', genre: 'Thriller', sort: 'SortName', randomizeWindow: true },
                    // Latest shouldn't use a random window, we want the actual newest movies!
                    { name: 'Latest', genre: null, sort: 'DateCreated', sortOrder: 'Descending', randomizeWindow: false },
                    { name: 'Suggestions', genre: null, sort: 'SortName', randomizeWindow: true },
                    { name: 'Fantasy', genre: 'Fantasy', sort: 'SortName', randomizeWindow: true },
                    { name: 'Romance', genre: 'Romance', sort: 'SortName', randomizeWindow: true },
                    { name: 'Crime', genre: 'Crime', sort: 'SortName', randomizeWindow: true },
                    { name: 'Adventure', genre: 'Adventure', sort: 'SortName', randomizeWindow: true },
                    { name: 'Animation', genre: 'Animation', sort: 'SortName', randomizeWindow: true },
                    { name: 'Mystery', genre: 'Mystery', sort: 'SortName', randomizeWindow: true }
                ];

                let lists;
                const cachedData = sessionStorage.getItem('virtualStoreCache');

                if (cachedData) {
                    lists = JSON.parse(cachedData);
                } else {
                    const catPromises = categories.map(async (cat) => {
                        const genreParam = cat.genre ? `&Genres=${cat.genre}` : '';
                        const sortParam = cat.sortOrder ? `&SortBy=${cat.sort}&SortOrder=${cat.sortOrder}` : `&SortBy=${cat.sort}`;

                        const countUrl = `${jfServer}/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=1&Fields=Id${genreParam}`;
                        const countRes = await fetch(countUrl, { headers: { 'X-Emby-Token': jfToken } });
                        const countData = await countRes.json();
                        const total = countData.TotalRecordCount || 0;

                        if (total === 0) return [];

                        const limit = Math.min(100, total);
                        const maxStart = Math.max(0, total - limit);
                        const startIndex = cat.randomizeWindow === false ? 0 : Math.floor(Math.random() * maxStart);

                        const dataUrl = `${jfServer}/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=${limit}&StartIndex=${startIndex}${sortParam}&Fields=${fields}${genreParam}`;
                        const res = await fetch(dataUrl, { headers: { 'X-Emby-Token': jfToken } });
                        const data = await res.json();

                        let items = extractItems(data);
                        return shuffleArray(items);
                    });

                    lists = await Promise.all(catPromises);
                    sessionStorage.setItem('virtualStoreCache', JSON.stringify(lists));
                }

                // Fallback list of all movies in case a genre is completely empty on their server
                const allMovies = lists.flat().filter(m => m !== undefined);

                // Progressive Rendering: Hide the loading screen immediately so the user can enter the room!
                // The physical gondolas will render instantly, and the movies will pop in as their textures finish loading.
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 500);

                // --- Build Wall Posters ---
                function buildWallPosters(movies) {
                    if (!movies || movies.length === 0) return;

                    const posterPositions = [
                        // Front Wall (Z = 32.3, looking back into the room -> rotate Math.PI)
                        { x: -25, z: 32.3, rotY: Math.PI }, // Shifted outwards to clear the door
                        { x: -15, z: 32.3, rotY: Math.PI },
                        { x: 15,  z: 32.3, rotY: Math.PI },
                        { x: 25,  z: 32.3, rotY: Math.PI },
                        // Side Walls (By the front door)
                        { x: -29.8, z: 27, rotY: Math.PI / 2 }, // Left Wall
                        { x: 29.8,  z: 27, rotY: -Math.PI / 2 } // Right Wall
                    ];

                    // Deterministically pick 6 movies
                    const selected = [];
                    const step = Math.max(1, Math.floor(movies.length / posterPositions.length));
                    for (let i = 0; i < posterPositions.length; i++) selected.push(movies[(i * step) % movies.length]);

                    const posterGeo = new THREE.PlaneGeometry(6, 9);
                    const frameGeo = new THREE.BoxGeometry(6.4, 9.4, 0.2);
                    const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });

                    selected.forEach((item, index) => {
                        const pos = posterPositions[index];
                        const group = new THREE.Group();
                        group.position.set(pos.x, 6.5, pos.z);
                        group.rotation.y = pos.rotY;

                        const frame = new THREE.Mesh(frameGeo, frameMat);
                        group.add(frame);

                        // Base color MUST be 0xffffff otherwise the loaded texture is multiplied by dark grey!
                        const posterMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
                        const poster = new THREE.Mesh(posterGeo, posterMat);
                        poster.position.z = 0.12;
                        group.add(poster);

                        // Add a subtle gallery SpotLight pointing down at the poster!
                        const light = new THREE.SpotLight(0xffeedd, 1.2, 15, Math.PI / 4, 0.8, 1);
                        light.position.set(0, 6, 3); // High up and slightly out from the wall
                        
                        // SpotLights need a target to point at
                        const targetObj = new THREE.Object3D();
                        targetObj.position.set(0, 0, 0); // Point exactly at the center of the poster
                        group.add(targetObj);
                        
                        light.target = targetObj;
                        group.add(light);

                        scene.add(group);

                        const imgUrl = `${jfServer}/Items/${item.Id}/Images/Primary?maxWidth=1024&quality=90`;
                        fetch(imgUrl, { headers: { 'X-Emby-Token': jfToken } })
                            .then(res => res.blob())
                            .then(blob => createImageBitmap(blob, { imageOrientation: 'flipY' }))
                            .then(bmp => {
                                const tex = new THREE.CanvasTexture(bmp);
                                tex.colorSpace = THREE.SRGBColorSpace;
                                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                                poster.material.map = tex;
                                poster.material.needsUpdate = true;
                            }).catch(e => console.error(e));
                    });
                }

                // The "Back-to-Back E" layout
                // We order these by proximity to the camera (Z=14) so the semaphore prioritizes the closest movies!
                await Promise.all([
                    // Front Gondolas (Closest)
                    buildGondola(lists[5], { x: -13, z: 12 }, 0, 14, true, 3, allMovies, categories[5].name, lists[11], categories[11].name),
                    buildGondola(lists[8], { x: 13, z: 12 }, 0, 14, true, 3, allMovies, categories[8].name, lists[14], categories[14].name),

                    // Middle Gondolas
                    buildGondola(lists[4], { x: -13, z: -2 }, 0, 14, true, 3, allMovies, categories[4].name, lists[10], categories[10].name),
                    buildGondola(lists[7], { x: 13, z: -2 }, 0, 14, true, 3, allMovies, categories[7].name, lists[13], categories[13].name),

                    // Back Gondolas
                    buildGondola(lists[3], { x: -13, z: -16 }, 0, 14, true, 3, allMovies, categories[3].name, lists[9], categories[9].name),
                    buildGondola(lists[6], { x: 13, z: -16 }, 0, 14, true, 3, allMovies, categories[6].name, lists[12], categories[12].name),

                    // Outer Walls
                    buildGondola(lists[0], { x: -27, z: -5 }, Math.PI / 2, 50, false, 5, allMovies, categories[0].name), // Left Wall
                    buildGondola(lists[1], { x: 27, z: -5 }, -Math.PI / 2, 50, false, 5, allMovies, categories[1].name), // Right Wall
                    buildGondola(lists[2], { x: 0, z: -30 }, 0, 50, false, 5, allMovies, categories[2].name) // Back Wall
                ]);

                // Build posters AFTER all gondolas finish loading so it doesn't steal network bandwidth!
                buildWallPosters(allMovies);
            } catch (e) {
                console.error("Failed to load store data", e);
                loadingScreen.innerText = "Error loading store.";
            }
        }

        // Builds a shelving unit. Double-sided for center gondolas, single-sided for walls.
        async function buildGondola(itemsFront, position, rotationY, length = 20, isDoubleSided = false, shelfCount = 3, fallbackItems = null, labelFront = null, itemsBack = null, labelBack = null) {
            if (!itemsFront || !itemsFront.length) itemsFront = fallbackItems;
            if (isDoubleSided && (!itemsBack || !itemsBack.length)) itemsBack = fallbackItems;
            if (!itemsFront || !itemsFront.length) return;

            const gondola = new THREE.Group();
            gondola.position.set(position.x, 0, position.z);
            gondola.rotation.y = rotationY;
            scene.add(gondola);

            function createSignTexture(text) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#4b0082'; // Purple
                ctx.fillRect(0, 0, 1024, 256);
                ctx.strokeStyle = '#FDDA0D'; // Yellow border
                ctx.lineWidth = 16;
                ctx.strokeRect(8, 8, 1008, 240);
                ctx.fillStyle = '#FDDA0D';
                ctx.font = 'italic bold 100px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text.toUpperCase(), 512, 128);
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            if (labelFront) {
                const signMatFront = new THREE.MeshBasicMaterial({ map: createSignTexture(labelFront) });
                const signMatBack = labelBack ? new THREE.MeshBasicMaterial({ map: createSignTexture(labelBack) }) : signMatFront;
                const edgeMat = new THREE.MeshBasicMaterial({ color: 0xFDDA0D });

                // Materials: Right, Left, Top, Bottom, Front (+Z), Back (-Z)
                const signMats = [edgeMat, edgeMat, edgeMat, edgeMat, signMatFront, signMatBack];

                const signGeo = new THREE.BoxGeometry(6, 1.5, 0.1);
                const sign = new THREE.Mesh(signGeo, signMats);

                sign.position.set(0, shelfCount * 2 + 1.5, 0);

                const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 1);
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
                const pole1 = new THREE.Mesh(poleGeo, poleMat);
                pole1.position.set(-2, shelfCount * 2 + 0.5, 0);
                const pole2 = new THREE.Mesh(poleGeo, poleMat);
                pole2.position.set(2, shelfCount * 2 + 0.5, 0);

                gondola.add(sign);
                gondola.add(pole1);
                gondola.add(pole2);
            }

            // Backboard
            // Classic Blockbuster Beige/Cream Pegboard Metal
            function createPegboardTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#9e998a'; // Darkened to a drab industrial grey/beige
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#222222';
                // Draw 4 peg holes
                ctx.beginPath(); ctx.arc(32, 32, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(96, 32, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(32, 96, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(96, 96, 5, 0, Math.PI*2); ctx.fill();
                
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
                // Repeat density based on physical wall size
                tex.repeat.set(length * 2, (shelfCount * 2 + 2) * 2);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                return tex;
            }
            
            const backMat = new THREE.MeshStandardMaterial({ map: createPegboardTexture(), roughness: 0.8, metalness: 0.1 });
            const backGeo = new THREE.BoxGeometry(length, shelfCount * 2 + 2, 0.5);
            const back = new THREE.Mesh(backGeo, backMat);
            back.position.set(0, shelfCount - 0.5, 0); // Centered height
            back.userData = { isShelf: true };
            gondola.add(back);
            interactableMeshes.push(back);

            const caseGeo = new THREE.BoxGeometry(1, 1.5, 0.10);
            
            // Glossy black clamshell plastic for the edges of the movie cases
            const casePlasticMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
            
            // Create a classic "BE KIND REWIND" rental sticker to slap on random movies
            function createStickerTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffcc00'; // Yellow border
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#0000aa'; // Blue inner border
                ctx.fillRect(5, 5, 118, 118);
                ctx.fillStyle = '#ffcc00'; // Yellow center
                ctx.fillRect(10, 10, 108, 108);
                
                ctx.fillStyle = '#0000aa';
                ctx.font = 'bold 20px "Helvetica", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('BE KIND', 64, 55);
                ctx.fillText('PLEASE', 64, 80);
                ctx.fillText('REWIND', 64, 105);
                
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }
            const stickerMat = new THREE.MeshStandardMaterial({ map: createStickerTexture(), roughness: 0.5, transparent: true, depthWrite: false });
            const stickerGeo = new THREE.PlaneGeometry(0.35, 0.35);

            // Classic Blockbuster Shelf Metal
            const solidMat = new THREE.MeshStandardMaterial({ color: 0x8c8779, roughness: 0.6, metalness: 0.3 });

            const itemsPerShelf = Math.floor(length / 1.5);
            const sides = isDoubleSided ? [1, -1] : [1]; // 1 = Front side (+Z), -1 = Back side (-Z)
            const shelfPromises = [];

            for (const side of sides) {
                const sideItems = side === 1 ? itemsFront : itemsBack;
                if (!sideItems || !sideItems.length) continue;

                // We start at 0 instead of a random index! The array is ALREADY shuffled by loadData().
                // If we pick a random index here, returning from BFCache will pick 30 DIFFERENT movies
                // out of the 100 cached items, defeating the image cache!
                let itemIndex = 0;

                for (let s = 0; s < shelfCount; s++) {
                    const shelfHeight = 0.5 + s * 2;
                    const plankGeo = new THREE.BoxGeometry(length, 0.1, 1.2);
                    const plank = new THREE.Mesh(plankGeo, solidMat);
                    plank.position.set(0, shelfHeight - 0.75, side * 0.6);
                    gondola.add(plank);
                    
                    // Blockbuster Blue Plastic Ticket Rail
                    const railGeo = new THREE.BoxGeometry(length, 0.15, 0.05);
                    const railMat = new THREE.MeshStandardMaterial({ color: 0x0000aa, roughness: 0.3, metalness: 0.1 });
                    const rail = new THREE.Mesh(railGeo, railMat);
                    // 0.6 is the center of the plank (which is 1.2 deep). So +0.6 gets us to the front edge.
                    rail.position.set(0, shelfHeight - 0.75, side * (0.6 + 0.6 + 0.025)); 
                    gondola.add(rail);

                    const shelfItems = [];
                    for (let i = 0; i < itemsPerShelf; i++) {
                        shelfItems.push(sideItems[itemIndex % sideItems.length]);
                        itemIndex++;
                    }

                    // Parallelize image fetching for this shelf
                    const buildShelfItems = async () => {
                        const itemPromises = shelfItems.map(async (item, i) => {
                            const texData = await loadTexture(item.Id);

                            let frontMat;
                            if (texData) {
                                frontMat = new THREE.MeshStandardMaterial({ map: texData.texture, roughness: 0.2 });
                            } else {
                                frontMat = new THREE.MeshStandardMaterial({ color: 0x4ade80 });
                            }

                            // Use a standard dark color for the shelf. It's barely visible anyway!
                            // Create unique material instances so we can lazily inject textures later on click
                            const backMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.5 });
                            const spineMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.5 });

                            const caseMesh = new THREE.Mesh(caseGeo, [casePlasticMat, spineMat, casePlasticMat, casePlasticMat, frontMat, backMat]);
                            
                            // 30% chance to have a "BE KIND REWIND" sticker!
                            if (Math.random() < 0.3) {
                                const sticker = new THREE.Mesh(stickerGeo, stickerMat);
                                // Slap it on the bottom right corner of the front cover
                                sticker.position.set(0.2, -0.4, 0.051); 
                                // Give it a random crooked angle so it looks hand-placed!
                                sticker.rotation.z = (Math.random() - 0.5) * 0.4;
                                caseMesh.add(sticker);
                            }
                            const xPos = (i - shelfItems.length / 2) * 1.5 + 0.75;
                            caseMesh.position.set(xPos, shelfHeight, side * 0.8);

                            if (side === -1) {
                                caseMesh.rotation.y = Math.PI;
                                caseMesh.rotation.x = 0.1;
                            } else {
                                caseMesh.rotation.x = -0.1;
                            }

                            caseMesh.userData = { item: item, bitmap: texData ? texData.bitmap : null, id: item.Id, title: item.Name, isCase: true, originalPos: caseMesh.position.clone(), originalRot: caseMesh.rotation.clone() };
                            gondola.add(caseMesh);
                            interactableMeshes.push(caseMesh);
                        });
                        await Promise.all(itemPromises);
                    };
                    shelfPromises.push(buildShelfItems());
                }
            }

            await Promise.all(shelfPromises);
        }

            // --- Navigation Nodes (Predetermined Standing Spots) ---
            const nodes = [];

            // Create a texture that looks like a ring, but applied to a solid plane so the whole square is clickable
            const nodeCanvas = document.createElement('canvas');
            nodeCanvas.width = 128;
            nodeCanvas.height = 128;
            const nodeCtx = nodeCanvas.getContext('2d');

            // Faint dark circle background for better visibility
            nodeCtx.fillStyle = 'rgba(0,0,0,0.4)';
            nodeCtx.beginPath();
            nodeCtx.arc(64, 64, 60, 0, Math.PI * 2);
            nodeCtx.fill();

            nodeCtx.strokeStyle = '#ffffff';
            nodeCtx.lineWidth = 10;
            nodeCtx.beginPath();
            nodeCtx.arc(64, 64, 48, 0, Math.PI * 2);
            nodeCtx.stroke();
            const nodeTex = new THREE.CanvasTexture(nodeCanvas);

            const nodeGeo = new THREE.PlaneGeometry(5, 5); // 5x5 clickable area
            nodeGeo.rotateX(-Math.PI / 2);

            const nodePositions = [
                // Center Aisle
                {x: 0, z: 20}, {x: 0, z: 12}, {x: 0, z: 5}, {x: 0, z: -2}, {x: 0, z: -9}, {x: 0, z: -16}, {x: 0, z: -23},
                // Left Sub-Aisles
                {x: -14, z: 19}, {x: -14, z: 5}, {x: -14, z: -9}, {x: -14, z: -23},
                // Right Sub-Aisles
                {x: 14, z: 19}, {x: 14, z: 5}, {x: 14, z: -9}, {x: 14, z: -23}
            ];

            for (let pos of nodePositions) {
                const nodeMat = new THREE.MeshBasicMaterial({ map: nodeTex, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                node.position.set(pos.x, -1.48, pos.z);
                node.userData = { isNode: true, targetX: pos.x, targetZ: pos.z };
                scene.add(node);
                interactableMeshes.push(node);
                nodes.push(node);
            }

            let targetCameraX = 0;
            let currentCameraX = 0;
            let targetCameraZ = 14;
            let currentCameraZ = 14;

            // Camera Rotation (Gyroscopic/Drag)
            let cameraYaw = 0;
            let cameraPitch = -0.3; // Start with a downward tilt to look at the shelves from above
            camera.rotation.order = 'YXZ'; // Important for FPS-style rotation
            camera.rotation.y = cameraYaw;
            camera.rotation.x = cameraPitch;


            // --- State Machine & Inspection ---
            const STATE = { BROWSE: 0, INSPECT: 1, PLAYING: 2 };
            let currentState = STATE.BROWSE;
            let inspectedMesh = null;
            let originalPosition = new THREE.Vector3();
            let originalRotation = new THREE.Euler();

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredMesh = null;

            // --- Input Handling (Gyroscopic Look, Inspect, Move) ---
            let isDragging = false;
            let dragDistance = 0;
            let previousMousePosition = { x: 0, y: 0 };
            let targetSpin = 0;
            let currentSpin = 0;

            function onPointerDown(clientX, clientY) {
                isDragging = true;
                dragDistance = 0;
                previousMousePosition = { x: clientX, y: clientY };
                if (currentState === STATE.INSPECT && inspectedMesh) {
                    document.body.style.cursor = 'grabbing';
                }
            }

            function onPointerMove(clientX, clientY) {
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                if (isDragging) {
                    const deltaX = clientX - previousMousePosition.x;
                    const deltaY = clientY - previousMousePosition.y;
                    dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

                    if (currentState === STATE.INSPECT && inspectedMesh) {
                        targetSpin += deltaX * 0.01;
                    } else if (currentState === STATE.BROWSE) {
                        cameraYaw += deltaX * 0.005;
                        cameraPitch += deltaY * 0.005;
                        cameraPitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, cameraPitch));
                        camera.rotation.y = cameraYaw;
                        camera.rotation.x = cameraPitch;
                    }
                    previousMousePosition = { x: clientX, y: clientY };
                }
            }

            function onPointerUp() {
                isDragging = false;
                if (currentState === STATE.INSPECT && inspectedMesh) {
                    document.body.style.cursor = 'grab';
                    const halfTurns = Math.round(targetSpin / Math.PI);
                    targetSpin = halfTurns * Math.PI;
                }
            }

            window.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('touchstart', (e) => onPointerDown(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            window.addEventListener('touchmove', (e) => onPointerMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            window.addEventListener('touchend', onPointerUp);

            window.addEventListener('click', (e) => {
                if (currentState === STATE.BROWSE) {
                    if (dragDistance > 10) return; // It was a pan, not a click

                    if (hoveredMesh && hoveredMesh.userData) {
                        if (hoveredMesh.userData.isExit) {
                            parent.postMessage({ type: 'EXIT' }, '*');
                            return;
                        } else if (hoveredMesh.userData.isNode) {
                            // Clicked a floor node to walk
                            targetCameraX = hoveredMesh.userData.targetX;
                            targetCameraZ = hoveredMesh.userData.targetZ;
                        } else if (hoveredMesh.userData.isCase) {

                            // Check distance
                            const caseWorldPos = new THREE.Vector3();
                            hoveredMesh.getWorldPosition(caseWorldPos);

                            const dx = camera.position.x - caseWorldPos.x;
                            const dz = camera.position.z - caseWorldPos.z;
                            const dist2D = Math.sqrt(dx*dx + dz*dz);

                            if (dist2D > 12) {
                                // Find where the user should stand to look at this movie (4 units in front of it)
                                const caseWorldQuat = new THREE.Quaternion();
                                hoveredMesh.getWorldQuaternion(caseWorldQuat);
                                const interactionPoint = new THREE.Vector3(0, 0, 4);
                                interactionPoint.applyQuaternion(caseWorldQuat);
                                interactionPoint.add(caseWorldPos);

                                // Find the nearest node to that optimal standing spot
                                let nearestNode = nodes[0];
                                let minDist = Infinity;
                                for (let node of nodes) {
                                    const nd = Math.sqrt(Math.pow(node.position.x - interactionPoint.x, 2) + Math.pow(node.position.z - interactionPoint.z, 2));
                                    if (nd < minDist) {
                                        minDist = nd;
                                        nearestNode = node;
                                    }
                                }
                                targetCameraX = nearestNode.userData.targetX;
                                targetCameraZ = nearestNode.userData.targetZ;
                                return; // Skip inspection for now, they are just walking over to it
                            }

                            // Clicked a movie to inspect (Close enough)
                            currentState = STATE.INSPECT;
                            inspectedMesh = hoveredMesh;

                            // Lazily generate the back and spine textures the very first time the user picks up this specific movie
                            if (!inspectedMesh.userData.hasBackCover) {
                                const item = inspectedMesh.userData.item;
                                const bitmap = inspectedMesh.userData.bitmap;
                                let palette = null;

                                // Extract color ON DEMAND just for this one movie!
                                if (bitmap) {
                                    const tinyCanvas = document.createElement('canvas');
                                    tinyCanvas.width = 16;
                                    tinyCanvas.height = 16;
                                    const tinyCtx = tinyCanvas.getContext('2d');
                                    tinyCtx.drawImage(bitmap, 0, 0, 16, 16);
                                    const pixels = tinyCtx.getImageData(0, 0, 16, 16).data;

                                    let r = 0, g = 0, b = 0, count = 0;
                                    for (let i = 0; i < pixels.length; i += 4) {
                                        r += pixels[i]; g += pixels[i+1]; b += pixels[i+2]; count++;
                                    }

                                    const avgR = Math.floor(r / count);
                                    const avgG = Math.floor(g / count);
                                    const avgB = Math.floor(b / count);
                                    const bgColor = `rgb(${avgR}, ${avgG}, ${avgB})`;

                                    const luminance = 0.2126 * (avgR/255) + 0.7152 * (avgG/255) + 0.0722 * (avgB/255);
                                    const isLight = luminance > 0.45;

                                    palette = {
                                        bg: bgColor,
                                        text: isLight ? '#111111' : '#ffffff',
                                        subtext: isLight ? '#333333' : '#cccccc',
                                        divider: isLight ? '#999999' : '#333333'
                                    };
                                }

                                const backTex = createBackCoverTexture(item, palette);
                                const spineTex = createSpineTexture(item, palette);

                                inspectedMesh.material[5].map = backTex;
                                inspectedMesh.material[5].color.setHex(0xffffff); // Clear color fallback
                                inspectedMesh.material[5].needsUpdate = true;
                                inspectedMesh.material[1].map = spineTex;
                                inspectedMesh.material[1].color.setHex(0xffffff);
                                inspectedMesh.material[1].needsUpdate = true;
                                inspectedMesh.userData.hasBackCover = true;
                            }

                            // Temporarily change roughness to matte to prevent glare from washing out the HD cover
                            inspectedMesh.material[4].roughness = 0.9;
                            inspectedMesh.material[4].needsUpdate = true;

                            // High-Res Image Swap
                            if (!inspectedMesh.userData.lowResMap) {
                                inspectedMesh.userData.lowResMap = inspectedMesh.material[4].map;
                            }
                            const currentMesh = inspectedMesh;
                            const itemId = currentMesh.userData.item.Id;
                            const highResUrl = `${jfServer}/Items/${itemId}/Images/Primary?maxWidth=1024&quality=90`;

                            fetch(highResUrl, { headers: { 'X-Emby-Token': jfToken } })
                                .then(res => res.blob())
                                .then(blob => createImageBitmap(blob, { imageOrientation: 'flipY' }))
                                .then(bmp => {
                                    // Only swap if they are still holding THIS specific movie
                                    if (inspectedMesh === currentMesh && currentState === STATE.INSPECT) {
                                        const highResTex = new THREE.Texture(bmp);
                                        highResTex.colorSpace = THREE.SRGBColorSpace;
                                        highResTex.needsUpdate = true;
                                        currentMesh.material[4].map = highResTex;
                                        currentMesh.material[4].needsUpdate = true;
                                        currentMesh.userData.highResMap = highResTex;
                                    } else {
                                        // They already put it back, so cache it in userData for next time they pick it up
                                        const highResTex = new THREE.Texture(bmp);
                                        highResTex.colorSpace = THREE.SRGBColorSpace;
                                        highResTex.needsUpdate = true;
                                        currentMesh.userData.highResMap = highResTex;
                                    }
                                }).catch(e => console.error(e));

                            // If it already loaded from a previous inspect, swap it instantly!
                            if (currentMesh.userData.highResMap) {
                                currentMesh.material[4].map = currentMesh.userData.highResMap;
                                currentMesh.material[4].needsUpdate = true;
                            }

                            originalPosition.copy(inspectedMesh.position);
                            originalRotation.copy(inspectedMesh.rotation);
                            inspectedMesh.userData.originalParent = inspectedMesh.parent;

                            scene.attach(inspectedMesh);

                            const targetWorldPos = new THREE.Vector3();
                            targetWorldPos.copy(camera.position);
                            // Move it forward relative to camera's current rotation
                            const forward = new THREE.Vector3(0, 0, -2);
                            forward.applyQuaternion(camera.quaternion);
                            targetWorldPos.add(forward);

                            // Align rotation perfectly with camera
                            inspectedMesh.position.copy(targetWorldPos);
                            inspectedMesh.quaternion.copy(camera.quaternion);

                            targetSpin = 0;
                            currentSpin = 0;

                            selectedItem = inspectedMesh.userData;
                            hudTitle.innerText = selectedItem.title || selectedItem.name;
                            hud.classList.add('show');
                            document.body.style.cursor = 'grab';
                        }
                    }
                } else if (currentState === STATE.INSPECT) {
                    if (dragDistance > 10) return;

                    currentState = STATE.BROWSE;

                    if (inspectedMesh.userData.lowResMap) {
                        inspectedMesh.material[4].map = inspectedMesh.userData.lowResMap;
                        inspectedMesh.material[4].needsUpdate = true;
                    }

                    // Restore glossy plastic look for the shelf
                    inspectedMesh.material[4].roughness = 0.2;
                    inspectedMesh.material[4].needsUpdate = true;

                    inspectedMesh.userData.originalParent.attach(inspectedMesh);
                    inspectedMesh.position.copy(originalPosition);
                    inspectedMesh.rotation.copy(originalRotation);

                    inspectedMesh = null;
                    selectedItem = null;
                    hud.classList.remove('show');
                    document.body.style.cursor = 'default';
                }
            });

            hudPlay.addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedItem && inspectedMesh) {
                    currentState = STATE.PLAYING;
                    hud.classList.remove('show');
                    document.body.style.cursor = 'default';

                    // Black overlay to fade out
                    const overlay = document.createElement('div');
                    overlay.style.position = 'absolute';
                    overlay.style.top = '0'; overlay.style.left = '0';
                    overlay.style.width = '100vw'; overlay.style.height = '100vh';
                    overlay.style.backgroundColor = 'black';
                    overlay.style.opacity = '0';
                    overlay.style.transition = 'opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                    overlay.style.pointerEvents = 'none';
                    overlay.style.zIndex = '9999';
                    document.body.appendChild(overlay);

                    const startRotY = inspectedMesh.rotation.y;
                    // Rotate counter-clockwise so the right edge (cover) swings forward and left
                    const endRotY = startRotY + Math.PI / 1.2;
                    const startPos = inspectedMesh.position.clone();

                    // Move the center of the box to the right and very close to the camera,
                    // so the swinging front cover perfectly slices through the viewport!
                    const targetWorldPos = new THREE.Vector3(1.2, 0, -0.8);
                    targetWorldPos.applyMatrix4(camera.matrixWorld);

                    let startTime = null;
                    const duration = 800;

                    setTimeout(() => overlay.style.opacity = '1', 50);

                    function playAnim(time) {
                        if (!startTime) startTime = time;
                        const progress = Math.min((time - startTime) / duration, 1);

                        // Smooth cubic ease for a cinematic feel
                        const ease = progress * progress * (3 - 2 * progress);

                        inspectedMesh.rotation.y = startRotY + (endRotY - startRotY) * ease;
                        inspectedMesh.position.lerpVectors(startPos, targetWorldPos, ease);

                        if (progress < 1) {
                            requestAnimationFrame(playAnim);
                        } else {
                            parent.postMessage({ type: 'OPEN_DETAILS', payload: { itemId: selectedItem.id } }, '*');
                        }
                    }
                    requestAnimationFrame(playAnim);
                }
            });

            let rafId;
            function animate() {
                rafId = requestAnimationFrame(animate);

                if (currentState === STATE.BROWSE) {
                    currentCameraX += (targetCameraX - currentCameraX) * 0.1;
                    camera.position.x = currentCameraX;
                    currentCameraZ += (targetCameraZ - currentCameraZ) * 0.1;
                    camera.position.z = currentCameraZ;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(interactableMeshes);

                    if (intersects.length > 0) {
                        const hit = intersects[0].object;
                        if (hoveredMesh !== hit) {
                            // Reset previous hovered mesh
                            if (hoveredMesh) {
                                if (hoveredMesh.userData.isCase) hoveredMesh.position.copy(hoveredMesh.userData.originalPos);
                                else if (hoveredMesh.userData.isNode) hoveredMesh.material.opacity = 0.4;
                                else if (hoveredMesh.userData.isExit) hoveredMesh.material.opacity = 0.3;
                            }

                            // Set new hovered mesh
                            hoveredMesh = hit;
                            if (hoveredMesh.userData.isCase) {
                                hoveredMesh.position.copy(hoveredMesh.userData.originalPos);
                                hoveredMesh.translateZ(0.2); // Pops out locally from gondola
                                document.body.style.cursor = 'pointer';
                            }
                            else if (hoveredMesh.userData.isNode) {
                                hoveredMesh.material.opacity = 0.9;
                                document.body.style.cursor = 'pointer';
                            }
                            else if (hoveredMesh.userData.isExit) {
                                hoveredMesh.material.opacity = 0.7;
                                document.body.style.cursor = 'pointer';
                            }
                            else {
                                document.body.style.cursor = 'default';
                            }
                        }
                    } else if (hoveredMesh !== null) {
                        if (hoveredMesh.userData.isCase) hoveredMesh.position.copy(hoveredMesh.userData.originalPos);
                        else if (hoveredMesh.userData.isNode) hoveredMesh.material.opacity = 0.4;
                        else if (hoveredMesh.userData.isExit) hoveredMesh.material.opacity = 0.3;
                        hoveredMesh = null;
                        document.body.style.cursor = 'default';
                    }
                } else if (currentState === STATE.INSPECT && inspectedMesh) {
                    // Lock position relative to camera in world space
                    const targetWorldPos = new THREE.Vector3();
                    targetWorldPos.copy(camera.position);
                    const forward = new THREE.Vector3(0, 0, -2);
                    forward.applyQuaternion(camera.quaternion);
                    targetWorldPos.add(forward);

                    inspectedMesh.position.copy(targetWorldPos);

                    // Smoothly interpolate rotation to target
                    currentSpin += (targetSpin - currentSpin) * 0.1;

                    const baseQuat = new THREE.Quaternion().copy(camera.quaternion);
                    const spinQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), currentSpin);

                    // Multiply them: this perfectly spins the movie on its vertical axis RELATIVE to the screen
                    inspectedMesh.quaternion.copy(baseQuat).multiply(spinQuat);
                }

                renderer.render(scene, camera);
            }
            animate();

            const onResize = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };
            window.addEventListener('resize', onResize);

            cleanup3D = () => {
                cancelAnimationFrame(rafId);
                window.removeEventListener('resize', onResize);
                scene.traverse((o) => {
                    if (o.isMesh) {
                        o.geometry.dispose();
                        if (Array.isArray(o.material)) {
                            o.material.forEach(m => { m.map?.dispose(); m.dispose(); });
                        } else {
                            o.material.map?.dispose();
                            o.material.dispose();
                        }
                    }
                });
                renderer.dispose();
                renderer.forceContextLoss();
                document.body.removeChild(renderer.domElement);
            };
        }

        window.addEventListener('pagehide', () => {
            cleanup3D();
        });
    </script>
</body>
</html>

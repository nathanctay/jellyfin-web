<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfin 3D Store</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0d; /* Dark theme default */
            color: #f4f1ea;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(12, 12, 14, 0.8);
            border: 1px solid rgba(244, 241, 234, 0.2);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        #hud.show {
            display: block;
        }
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b0b0d;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <h3 id="loading-text">Loading shelves...</h3>
    </div>

    <div id="hud">
        <h2 id="hud-title">Title</h2>
        <button id="hud-play">Play</button>
    </div>

    <script type="module">
        import * as THREE from './vendor/three.module.min.js';

        // 1. Handshake Logic
        let jfToken = null;
        let jfServer = null;
        let jfUserId = null;

        // Tell the parent we are ready to receive the auth token
        parent.postMessage({ type: 'READY' }, '*');

        window.addEventListener('message', (event) => {
            // In a real prod setup, validate event.origin here.
            // For now we accept the token.
            if (event.data && event.data.type === 'AUTH') {
                jfToken = event.data.payload.token;
                jfServer = event.data.payload.serverUrl;
                jfUserId = event.data.payload.userId;
                console.log("3D Store received AUTH. Token:", jfToken ? "Present" : "Missing", "Server:", jfServer, "User:", jfUserId);
                init3D();
            } else if (event.data && event.data.type === 'SEERR_DATA') {
                console.log("Received Seerr Data", event.data.payload);
            }
        });

        // 2. Three.js Setup (Triggered after Auth)
        let cleanup3D = () => {};

        // HUD Elements
        const hud = document.getElementById('hud');
        const hudTitle = document.getElementById('hud-title');
        const hudPlay = document.getElementById('hud-play');
        const loadingScreen = document.getElementById('loading-screen');
        let selectedItem = null;

        async function init3D() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8.5, 14);
            // Initial tilt will be set by cameraPitch in the state block

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // Standard "Retail" Lighting (Bright and even)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
            scene.add(ambientLight);

            const overheadLight = new THREE.DirectionalLight(0xffffff, 0.5);
            overheadLight.position.set(0, 8, 3);
            scene.add(overheadLight);

            // Procedural Floor Texture (Classic retail tile/carpet)
            function createFloorTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0a0a0c';
                ctx.fillRect(0, 0, 512, 512);
                ctx.fillStyle = '#111114';
                for (let i=0; i<8; i++) {
                    for (let j=0; j<8; j++) {
                        if ((i+j)%2 === 0) ctx.fillRect(i*64, j*64, 64, 64);
                    }
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(20, 10);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            // Physical Store Room
            // Floor
            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({ 
                map: createFloorTexture(),
                roughness: 0.6, 
                metalness: 0.1 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, -1.49, 0); 
            scene.add(floor);

            // Walls and Ceiling
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0x151515, 
                roughness: 0.9, 
                side: THREE.BackSide // Render the inside of the box
            });
            const wallsGeo = new THREE.BoxGeometry(60, 15, 60);
            const walls = new THREE.Mesh(wallsGeo, wallMat);
            walls.position.set(0, 5, 0); 
            scene.add(walls);

            // Shelf Backboards (The walls of the gondolas)
            const backboardGeo = new THREE.BoxGeometry(12, 8, 0.2);
            const backboardMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            
            const leftBack = new THREE.Mesh(backboardGeo, backboardMat);
            leftBack.position.set(-8, 2, -0.8);
            scene.add(leftBack);
            
            const rightBack = new THREE.Mesh(backboardGeo, backboardMat);
            rightBack.position.set(8, 2, -0.8);
            scene.add(rightBack);

            const interactableMeshes = [];

            // Polyfill for CanvasRenderingContext2D.roundRect
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + r, y, r);
                this.closePath();
                return this;
            }

            function createBackCoverTexture(item, palette) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 768; // 1:1.5 ratio
                const ctx = canvas.getContext('2d');

                if (!palette) palette = { bg: '#1c1c1e', text: '#ffffff', subtext: '#cccccc', divider: '#333333' };

                // Background
                ctx.fillStyle = palette.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Title
                ctx.fillStyle = palette.text;
                ctx.font = 'bold 44px "Helvetica Neue", sans-serif';
                ctx.textAlign = 'left';

                function wrapText(context, text, x, y, maxWidth, lineHeight, maxLines = 10) {
                    if (!text) return y;
                    const words = text.split(' ');
                    let line = '';
                    let currentY = y;
                    let lines = 0;

                    for (let n = 0; n < words.length; n++) {
                        const testLine = line + words[n] + ' ';
                        const metrics = context.measureText(testLine);
                        const testWidth = metrics.width;
                        if (testWidth > maxWidth && n > 0) {
                            context.fillText(line, x, currentY);
                            line = words[n] + ' ';
                            currentY += lineHeight;
                            lines++;
                            if (lines >= maxLines) {
                                context.fillText('...', x, currentY);
                                return currentY + lineHeight;
                            }
                        } else {
                            line = testLine;
                        }
                    }
                    context.fillText(line, x, currentY);
                    return currentY + lineHeight;
                }

                let yPos = 80; // Moved up since top bar is gone
                yPos = wrapText(ctx, item.Name || 'Unknown Title', 30, yPos, canvas.width - 60, 50, 3);

                // Meta info
                ctx.font = '22px "Helvetica Neue", sans-serif';
                ctx.fillStyle = palette.subtext;
                const year = item.ProductionYear || '----';
                const rating = item.OfficialRating || 'NR';
                let runtime = '';
                if (item.RunTimeTicks) {
                    const mins = Math.floor(item.RunTimeTicks / 600000000);
                    const h = Math.floor(mins / 60);
                    const m = mins % 60;
                    runtime = h > 0 ? `${h}h ${m}m` : `${m}m`;
                }
                const genre = (item.Genres && item.Genres.length > 0) ? item.Genres[0] : '';
                ctx.fillText(`${year}  ·  ${rating}  ·  ${runtime}  ${genre ? '·  ' + genre : ''}`, 30, yPos + 10);
                yPos += 60;

                // Divider
                ctx.strokeStyle = palette.divider;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(30, yPos);
                ctx.lineTo(canvas.width - 30, yPos);
                ctx.stroke();
                yPos += 40;

                // Synopsis Header
                ctx.fillStyle = '#f5c518';
                ctx.font = 'bold 16px "Helvetica Neue", sans-serif';
                ctx.fillText('S Y N O P S I S', 30, yPos);
                yPos += 40;

                // Synopsis Body
                ctx.fillStyle = palette.text;
                ctx.font = '22px "Helvetica Neue", sans-serif';
                yPos = wrapText(ctx, item.Overview || 'No synopsis available.', 30, yPos, canvas.width - 60, 32, 12); // Added more lines since we removed top bar

                // Bottom Sticker
                ctx.fillStyle = '#111111';
                ctx.roundRect(canvas.width - 200, canvas.height - 100, 170, 70, 10);
                ctx.fill();
                ctx.strokeStyle = '#f5c518';
                ctx.lineWidth = 2;
                ctx.roundRect(canvas.width - 195, canvas.height - 95, 160, 60, 6);
                ctx.stroke();

                ctx.fillStyle = '#f5c518';
                ctx.font = 'bold 14px "Helvetica Neue", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('RENTAL COPY', canvas.width - 115, canvas.height - 62);
                ctx.fillStyle = '#aaaaaa';
                ctx.font = '12px "Helvetica Neue", sans-serif';
                ctx.fillText('Please Rewind', canvas.width - 115, canvas.height - 44);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            function createSpineTexture(item, palette) {
                const canvas = document.createElement('canvas');
                canvas.width = 64; // Aspect ratio 0.10 to 1.5 is 1:15 (64x960)
                canvas.height = 960;
                const ctx = canvas.getContext('2d');

                if (!palette) palette = { bg: '#1c1c1e', text: '#ffffff', subtext: '#cccccc', divider: '#333333' };

                // Background
                ctx.fillStyle = palette.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Sticker at Top
                ctx.fillStyle = '#f5c518'; // Yellow
                ctx.fillRect(0, 0, canvas.width, 100);
                
                // Sticker Text (Rotated slightly or stacked)
                ctx.fillStyle = '#111111';
                ctx.font = 'bold 14px "Helvetica Neue", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('SHELF', canvas.width / 2, 40);
                ctx.fillText('COPY', canvas.width / 2, 60);

                // Spine Title (Rotated 90 degrees)
                ctx.save();
                ctx.translate(canvas.width / 2, 160); // Start below the sticker
                ctx.rotate(Math.PI / 2); // Rotate 90 degrees clockwise
                
                ctx.fillStyle = palette.text;
                ctx.font = 'bold 36px "Helvetica Neue", sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                
                // Truncate if too long (roughly 750px width available when rotated)
                let title = item.Name || 'Unknown Title';
                if (ctx.measureText(title).width > 750) {
                    while (ctx.measureText(title + '...').width > 750 && title.length > 0) {
                        title = title.substring(0, title.length - 1);
                    }
                    title += '...';
                }
                
                ctx.fillText(title, 0, 0);
                ctx.restore();

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            // Helper to fetch images and extract average color
            async function loadTexture(itemId) {
                try {
                    const imgUrl = `${jfServer}/Items/${itemId}/Images/Primary?maxWidth=400&quality=80`;
                    const imgRes = await fetch(imgUrl, { headers: { 'X-Emby-Token': jfToken } });
                    if (!imgRes.ok) return null;
                    const blob = await imgRes.blob();
                    const bmp = await createImageBitmap(blob, { imageOrientation: 'flipY' });

                    // Extract true average color
                    const tinyCanvas = document.createElement('canvas');
                    tinyCanvas.width = 16;
                    tinyCanvas.height = 16;
                    const tinyCtx = tinyCanvas.getContext('2d');
                    tinyCtx.drawImage(bmp, 0, 0, 16, 16);
                    const pixels = tinyCtx.getImageData(0, 0, 16, 16).data;
                    
                    // Color Quantization (Binning) to find the Dominant Color
                    // This prevents contrasting colors (like Teal and Orange) from mixing into gray
                    const buckets = {};
                    let maxBucket = null;
                    let maxScore = -1;

                    for (let i = 0; i < pixels.length; i += 4) {
                        const r = pixels[i];
                        const g = pixels[i+1];
                        const b = pixels[i+2];
                        
                        // Bin into 32x32x32 buckets (8 bins per channel)
                        const rBin = Math.floor(r / 32);
                        const gBin = Math.floor(g / 32);
                        const bBin = Math.floor(b / 32);
                        const key = `${rBin},${gBin},${bBin}`;
                        
                        if (!buckets[key]) buckets[key] = { count: 0, r: 0, g: 0, b: 0 };
                        
                        buckets[key].count++;
                        buckets[key].r += r;
                        buckets[key].g += g;
                        buckets[key].b += b;
                    }
                    
                    // Evaluate the buckets
                    for (const key in buckets) {
                        const bucket = buckets[key];
                        const r = bucket.r / bucket.count;
                        const g = bucket.g / bucket.count;
                        const b = bucket.b / bucket.count;
                        
                        const r_norm = r / 255, g_norm = g / 255, b_norm = b / 255;
                        const max = Math.max(r_norm, g_norm, b_norm);
                        const min = Math.min(r_norm, g_norm, b_norm);
                        const l = (max + min) / 2;
                        let s = 0;
                        if (max !== min) {
                            s = l > 0.5 ? (max - min) / (2 - max - min) : (max - min) / (max + min);
                        }
                        
                        // Reward saturation. If a poster is Black & White, S=0, so the largest gray bucket wins.
                        // If it has color, vibrant buckets get a 3x multiplier to prevent them being overpowered by dark backgrounds.
                        let score = bucket.count;
                        if (l > 0.1 && l < 0.9) {
                            score += bucket.count * (s * 3); 
                        }
                        
                        if (score > maxScore) {
                            maxScore = score;
                            maxBucket = bucket;
                        }
                    }

                    const avgR = Math.floor(maxBucket.r / maxBucket.count);
                    const avgG = Math.floor(maxBucket.g / maxBucket.count);
                    const avgB = Math.floor(maxBucket.b / maxBucket.count);
                    
                    const bgColor = `rgb(${avgR}, ${avgG}, ${avgB})`;
                    
                    // WCAG Relative Luminance
                    const r_lin = avgR / 255;
                    const g_lin = avgG / 255;
                    const b_lin = avgB / 255;
                    const luminance = 0.2126 * r_lin + 0.7152 * g_lin + 0.0722 * b_lin;
                    
                    // Determine text color based on luminance
                    const isLight = luminance > 0.45;
                    const palette = {
                        bg: bgColor,
                        text: isLight ? '#111111' : '#ffffff',
                        subtext: isLight ? '#333333' : '#cccccc',
                        divider: isLight ? '#999999' : '#333333'
                    };

                    const tex = new THREE.Texture(bmp);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    tex.needsUpdate = true;
                    return { texture: tex, palette: palette };
                } catch (e) {
                    return null;
                }
            }
            // Load the store layout data
            await loadData();
        async function loadData() {
            try {
                const extractItems = (d) => Array.isArray(d) ? d : (d.Items || []);
                const fields = 'Overview,RunTimeTicks,ProductionYear,OfficialRating,Genres';
                
                // Fetch 9 distinct categories for our 9 massive structures
                const categories = [
                    { name: 'Action', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=Random&Fields=${fields}&Genres=Action` },
                    { name: 'Comedy', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=Random&Fields=${fields}&Genres=Comedy` },
                    { name: 'Drama', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=Random&Fields=${fields}&Genres=Drama` },
                    { name: 'Sci-Fi', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=Random&Fields=${fields}&Genres=Sci-Fi` },
                    { name: 'Horror', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=Random&Fields=${fields}&Genres=Horror` },
                    { name: 'Family', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=Random&Fields=${fields}&Genres=Family` },
                    { name: 'Thriller', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=Random&Fields=${fields}&Genres=Thriller` },
                    { name: 'Latest', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=DateCreated&SortOrder=Descending&Fields=${fields}` },
                    { name: 'Suggestions', url: `/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Limit=60&SortBy=Random&Fields=${fields}` }
                ];

                const catPromises = categories.map(async (cat) => {
                    const res = await fetch(`${jfServer}${cat.url}`, { headers: { 'X-Emby-Token': jfToken } });
                    const data = await res.json();
                    return extractItems(data);
                });
                
                const lists = await Promise.all(catPromises);

                // The "Back-to-Back E" layout
                // We run all Gondola builds in parallel to prevent massive sequential loading times
                await Promise.all([
                    // 1. The Outer Walls (Single Sided)
                    buildGondola(lists[0], { x: -18, z: 0 }, Math.PI / 2, 36, false), // Left Wall
                    buildGondola(lists[1], { x: 18, z: 0 }, -Math.PI / 2, 36, false), // Right Wall
                    buildGondola(lists[2], { x: 0, z: -18 }, 0, 36, false), // Back Wall
                    
                    // 2. The Gondolas (The "teeth" of the E, Double Sided)
                    // Left Side Gondolas
                    buildGondola(lists[3], { x: -11, z: -8 }, 0, 14, true),
                    buildGondola(lists[4], { x: -11, z: 0 }, 0, 14, true),
                    buildGondola(lists[5], { x: -11, z: 8 }, 0, 14, true),
                    
                    // Right Side Gondolas
                    buildGondola(lists[6], { x: 11, z: -8 }, 0, 14, true),
                    buildGondola(lists[7], { x: 11, z: 0 }, 0, 14, true),
                    buildGondola(lists[8], { x: 11, z: 8 }, 0, 14, true)
                ]);

                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 500);
            } catch (e) {
                console.error("Failed to load store data", e);
                loadingScreen.innerText = "Error loading store.";
            }
        }

        // Builds a shelving unit. Double-sided for center gondolas, single-sided for walls.
        async function buildGondola(items, position, rotationY, length = 20, isDoubleSided = false) {
            if (!items || !items.length) return;
            
            const gondola = new THREE.Group();
            gondola.position.set(position.x, 0, position.z);
            gondola.rotation.y = rotationY;
            scene.add(gondola);

            // Backboard
            const backMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const backGeo = new THREE.BoxGeometry(length, 8, 0.5);
            const back = new THREE.Mesh(backGeo, backMat);
            back.position.set(0, 3, 0); // Centered
            gondola.add(back);

            const caseGeo = new THREE.BoxGeometry(1, 1.5, 0.10);
            const solidMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });

            // 3 Vertical Shelves
            const shelfHeights = [0.5, 2.5, 4.5];
            const itemsPerShelf = Math.floor(length / 1.2); 
            
            const sides = isDoubleSided ? [1, -1] : [1]; // 1 = Front side (+Z), -1 = Back side (-Z)

            const shelfPromises = [];

            for (const side of sides) {
                for (let s = 0; s < 3; s++) {
                    const plankGeo = new THREE.BoxGeometry(length, 0.1, 1.2);
                    const plank = new THREE.Mesh(plankGeo, solidMat);
                    plank.position.set(0, shelfHeights[s] - 0.75, side * 0.6);
                    gondola.add(plank);

                    const startIndex = Math.max(0, Math.floor(Math.random() * (items.length - itemsPerShelf)));
                    const shelfItems = items.slice(startIndex, startIndex + itemsPerShelf);
                    
                    // Parallelize image fetching for this shelf
                    const buildShelfItems = async () => {
                        const itemPromises = shelfItems.map(async (item, i) => {
                            const texData = await loadTexture(item.Id);
                            
                            let frontMat, backTex, spineTex;
                            if (texData) {
                                frontMat = new THREE.MeshStandardMaterial({ map: texData.texture, roughness: 0.2 });
                                backTex = createBackCoverTexture(item, texData.palette);
                                spineTex = createSpineTexture(item, texData.palette);
                            } else {
                                frontMat = new THREE.MeshStandardMaterial({ color: 0x4ade80 });
                                backTex = createBackCoverTexture(item);
                                spineTex = createSpineTexture(item);
                            }
                            
                            const backMat = new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.5 });
                            const spineMat = new THREE.MeshStandardMaterial({ map: spineTex, roughness: 0.5 });
                            
                            const caseMesh = new THREE.Mesh(caseGeo, [solidMat, spineMat, solidMat, solidMat, frontMat, backMat]);
                            
                            const xPos = (i - shelfItems.length / 2) * 1.2 + 0.6;
                            caseMesh.position.set(xPos, shelfHeights[s], side * 0.8);
                            
                            if (side === -1) {
                                caseMesh.rotation.y = Math.PI;
                                caseMesh.rotation.x = 0.1;
                            } else {
                                caseMesh.rotation.x = -0.1;
                            }
                            
                            caseMesh.userData = { id: item.Id, title: item.Name, isCase: true, originalPos: caseMesh.position.clone(), originalRot: caseMesh.rotation.clone() };
                            gondola.add(caseMesh);
                            interactableMeshes.push(caseMesh);
                        });
                        await Promise.all(itemPromises);
                    };
                    shelfPromises.push(buildShelfItems());
                }
            }
            
            await Promise.all(shelfPromises);
        }

            // --- Navigation Nodes (Predetermined Standing Spots) ---
            const nodes = [];
            const nodeGeo = new THREE.RingGeometry(0.6, 0.8, 32); // A ring looks more like a modern UI marker
            nodeGeo.rotateX(-Math.PI / 2);
            
            for (let z of [14, 7, 0, -7, -14]) {
                const nodeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                node.position.set(0, -1.48, z);
                node.userData = { isNode: true, targetZ: z };
                scene.add(node);
                interactableMeshes.push(node);
                nodes.push(node);
            }

            let targetCameraZ = 14;
            let currentCameraZ = 14;
            
            // Camera Rotation (Gyroscopic/Drag)
            let cameraYaw = 0;
            let cameraPitch = -0.3; // Start with a downward tilt to look at the shelves from above
            camera.rotation.order = 'YXZ'; // Important for FPS-style rotation
            camera.rotation.y = cameraYaw;
            camera.rotation.x = cameraPitch;


            // --- State Machine & Inspection ---
            const STATE = { BROWSE: 0, INSPECT: 1 };
            let currentState = STATE.BROWSE;
            let inspectedMesh = null;
            let originalPosition = new THREE.Vector3();
            let originalRotation = new THREE.Euler();

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredMesh = null;

            // --- Input Handling (Gyroscopic Look, Inspect, Move) ---
            let isDragging = false;
            let dragDistance = 0;
            let previousMousePosition = { x: 0, y: 0 };
            let targetRotationY = 0;

            function onPointerDown(clientX, clientY) {
                isDragging = true;
                dragDistance = 0;
                previousMousePosition = { x: clientX, y: clientY };
                if (currentState === STATE.INSPECT && inspectedMesh) {
                    targetRotationY = inspectedMesh.rotation.y;
                    document.body.style.cursor = 'grabbing';
                }
            }

            function onPointerMove(clientX, clientY) {
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                if (isDragging) {
                    const deltaX = clientX - previousMousePosition.x;
                    const deltaY = clientY - previousMousePosition.y;
                    dragDistance += Math.abs(deltaX) + Math.abs(deltaY);
                    
                    if (currentState === STATE.INSPECT && inspectedMesh) {
                        targetRotationY += deltaX * 0.01;
                    } else if (currentState === STATE.BROWSE) {
                        cameraYaw += deltaX * 0.005;
                        cameraPitch += deltaY * 0.005;
                        cameraPitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, cameraPitch));
                        camera.rotation.y = cameraYaw;
                        camera.rotation.x = cameraPitch;
                    }
                    previousMousePosition = { x: clientX, y: clientY };
                }
            }

            function onPointerUp() {
                isDragging = false;
                if (currentState === STATE.INSPECT && inspectedMesh) {
                    document.body.style.cursor = 'grab';
                    const halfTurns = Math.round(targetRotationY / Math.PI);
                    targetRotationY = halfTurns * Math.PI;
                }
            }

            window.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onPointerUp);
            
            window.addEventListener('touchstart', (e) => onPointerDown(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            window.addEventListener('touchmove', (e) => onPointerMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            window.addEventListener('touchend', onPointerUp);

            window.addEventListener('click', (e) => {
                if (currentState === STATE.BROWSE) {
                    if (dragDistance > 10) return; // It was a pan, not a click

                    if (hoveredMesh && hoveredMesh.userData) {
                        if (hoveredMesh.userData.isNode) {
                            // Clicked a floor node to walk
                            targetCameraZ = hoveredMesh.userData.targetZ;
                        } else if (hoveredMesh.userData.isCase) {
                            // Clicked a movie to inspect
                            currentState = STATE.INSPECT;
                            inspectedMesh = hoveredMesh;
                            
                            originalPosition.copy(inspectedMesh.position);
                            originalRotation.copy(inspectedMesh.rotation);
                            inspectedMesh.userData.originalParent = inspectedMesh.parent;
                            
                            scene.attach(inspectedMesh);

                            const targetWorldPos = new THREE.Vector3();
                            targetWorldPos.copy(camera.position);
                            // Move it forward relative to camera's current rotation
                            const forward = new THREE.Vector3(0, 0, -2);
                            forward.applyQuaternion(camera.quaternion);
                            targetWorldPos.add(forward);
                            
                            // Align rotation perfectly with camera
                            inspectedMesh.position.copy(targetWorldPos);
                            inspectedMesh.rotation.copy(camera.rotation);
                            
                            targetRotationY = inspectedMesh.rotation.y;

                            selectedItem = inspectedMesh.userData;
                            hudTitle.innerText = selectedItem.title || selectedItem.name;
                            hud.classList.add('show');
                            document.body.style.cursor = 'grab';
                        }
                    }
                } else if (currentState === STATE.INSPECT) {
                    if (dragDistance > 10) return;

                    currentState = STATE.BROWSE;
                    
                    inspectedMesh.userData.originalParent.attach(inspectedMesh);
                    inspectedMesh.position.copy(originalPosition);
                    inspectedMesh.rotation.copy(originalRotation);
                    
                    inspectedMesh = null;
                    selectedItem = null;
                    hud.classList.remove('show');
                    document.body.style.cursor = 'default';
                }
            });

            hudPlay.addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedItem) {
                    parent.postMessage({ type: 'OPEN_DETAILS', payload: { itemId: selectedItem.id } }, '*');
                }
            });

            let rafId;
            function animate() {
                rafId = requestAnimationFrame(animate);

                if (currentState === STATE.BROWSE) {
                    currentCameraZ += (targetCameraZ - currentCameraZ) * 0.1;
                    camera.position.z = currentCameraZ;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(interactableMeshes);

                    if (intersects.length > 0) {
                        const hit = intersects[0].object;
                        if (hoveredMesh !== hit) {
                            // Reset previous hovered mesh
                            if (hoveredMesh) {
                                if (hoveredMesh.userData.isCase) hoveredMesh.position.copy(hoveredMesh.userData.originalPos);
                                else if (hoveredMesh.userData.isNode) hoveredMesh.material.opacity = 0.2;
                            }
                            
                            // Set new hovered mesh
                            hoveredMesh = hit;
                            if (hoveredMesh.userData.isCase) {
                                hoveredMesh.position.copy(hoveredMesh.userData.originalPos);
                                hoveredMesh.translateZ(0.2); // Pops out locally from gondola
                            }
                            else if (hoveredMesh.userData.isNode) hoveredMesh.material.opacity = 0.6;
                            
                            document.body.style.cursor = 'pointer';
                        }
                    } else if (hoveredMesh !== null) {
                        if (hoveredMesh.userData.isCase) hoveredMesh.position.copy(hoveredMesh.userData.originalPos);
                        else if (hoveredMesh.userData.isNode) hoveredMesh.material.opacity = 0.2;
                        hoveredMesh = null;
                        document.body.style.cursor = 'default';
                    }
                } else if (currentState === STATE.INSPECT && inspectedMesh) {
                    // Lock position relative to camera in world space
                    const targetWorldPos = new THREE.Vector3();
                    targetWorldPos.copy(camera.position);
                    const forward = new THREE.Vector3(0, 0, -2);
                    forward.applyQuaternion(camera.quaternion);
                    targetWorldPos.add(forward);
                    
                    inspectedMesh.position.copy(targetWorldPos);

                    // Smoothly interpolate rotation to target
                    inspectedMesh.rotation.y += (targetRotationY - inspectedMesh.rotation.y) * 0.1;
                    
                    // Keep pitch locked to camera
                    inspectedMesh.rotation.x = camera.rotation.x;
                    inspectedMesh.rotation.z = camera.rotation.z;
                }

                renderer.render(scene, camera);
            }
            animate();

            const onResize = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };
            window.addEventListener('resize', onResize);

            cleanup3D = () => {
                cancelAnimationFrame(rafId);
                window.removeEventListener('resize', onResize);
                scene.traverse((o) => {
                    if (o.isMesh) {
                        o.geometry.dispose();
                        if (Array.isArray(o.material)) {
                            o.material.forEach(m => { m.map?.dispose(); m.dispose(); });
                        } else {
                            o.material.map?.dispose();
                            o.material.dispose();
                        }
                    }
                });
                renderer.dispose();
                renderer.forceContextLoss();
                document.body.removeChild(renderer.domElement);
            };
        }

        window.addEventListener('unload', () => {
            cleanup3D();
        });
    </script>
</body>
</html>

                                tinyCanvas.width = 16; tinyCanvas.height = 16;
                                const tinyCtx = tinyCanvas.getContext('2d', { willReadFrequently: true });
                                tinyCtx.drawImage(b, 0, 0, 16, 16);
                                const px = tinyCtx.getImageData(0, 0, 16, 16).data;
                                let r = 0, g = 0, bl = 0, count = 0;
                                for(let i=0; i<px.length; i+=4){ r+=px[i]; g+=px[i+1]; bl+=px[i+2]; count++; }
                                const avgR = Math.floor(r/count);
                                const avgG = Math.floor(g/count);
                                const avgB = Math.floor(bl/count);
                                const luminance = 0.2126 * (avgR/255) + 0.7152 * (avgG/255) + 0.0722 * (avgB/255);
                                const isLight = luminance > 0.45;
                                palette = {
                                    bg: `rgb(${avgR}, ${avgG}, ${avgB})`,
                                    text: isLight ? '#111111' : '#ffffff',
                                    subtext: isLight ? '#333333' : '#cccccc',
                                    divider: isLight ? '#999999' : '#333333'
                                };
                            }
                            if (!palette) palette = { bg: '#1c1c1e', text: '#ffffff', subtext: '#cccccc', divider: '#333333' };
                            const backTex = createBackCoverTexture(item, palette, STORE_DESIGN);
                            const spineTex = createSpineTexture(item, palette, STORE_DESIGN);
                            sourceSleeveMat = new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.5 });
                            sourceSleeveMat.userData.isDynamicSleeve = true; // Tag for cleanup

                            const spineMat = new THREE.MeshStandardMaterial({ map: spineTex, roughness: 0.5 });
                            spineMat.userData.isDynamicSleeve = true; // Tag for cleanup

                            group.userData.dummySpineMat = spineMat; // pass to spine mesh
                            group.userData.dummyRightSpineMat = new THREE.MeshStandardMaterial({ color: palette.bg, roughness: 0.5 });
                            group.userData.dummyRightSpineMat.userData.isDynamicSleeve = true;
                        }
                    }

                    // Add dummy meshes initially with defaults or source materials
                    const backMesh = new THREE.Mesh(sharedBackGeo, sourceSleeveMat || defaultBackMat);
                    backMesh.position.z = - (halfDepth + 0.001); backMesh.rotation.y = Math.PI;
                    backMesh.name = 'back';
                    dummyGroup.add(backMesh);
                    
                    const spineMesh = new THREE.Mesh(sharedSpineGeo, (group && group.userData.dummySpineMat) || sourceSleeveMat || defaultSpineMat);
                    spineMesh.position.x = - (halfWidth + 0.001); spineMesh.rotation.y = -Math.PI / 2;
                    spineMesh.name = 'spine';
                    dummyGroup.add(spineMesh);

                    if (!isDvd) {
                        const rightSpineMesh = new THREE.Mesh(sharedSpineGeo, (group && group.userData.dummyRightSpineMat) || sourceSleeveMat || defaultSpineMat);
                        rightSpineMesh.position.x = halfWidth + 0.001; rightSpineMesh.rotation.y = Math.PI / 2;
                        rightSpineMesh.name = 'right_spine';
                        dummyGroup.add(rightSpineMesh);

                        const topMesh = new THREE.Mesh(sharedTopGeo, (group && group.userData.dummyRightSpineMat) || sourceSleeveMat || defaultSpineMat);
                        topMesh.position.y = halfHeight + 0.001; topMesh.rotation.x = -Math.PI / 2;
                        topMesh.name = 'top';
                        dummyGroup.add(topMesh);
                    }

                    if (sourceFrontMat) {
                        const frontMesh = new THREE.Mesh(sharedFrontGeo, sourceFrontMat);
                        frontMesh.position.z = halfDepth + 0.001;
                        frontMesh.name = 'front';
                        dummyGroup.add(frontMesh);
                    } else {
                        // Fetch full metadata and high-res image if the group wasn't loaded yet
                        const jfItemId = itemId.split('_').pop();
                        const imgUrl = `${jfServer}/Items/${jfItemId}/Images/Primary?maxWidth=512&quality=90`;
                        const itemUrl = `${jfServer}/Users/${jfUserId}/Items/${jfItemId}`;
                        
                        Promise.all([
                            fetch(imgUrl, { headers: { 'X-Emby-Token': jfToken } }).then(res => res.blob()).then(blob => createImageBitmap(blob, { imageOrientation: 'flipY' })),
                            fetch(itemUrl, { headers: { 'X-Emby-Token': jfToken } }).then(res => res.json())
                        ]).then(([bmp, fetchedItem]) => {
                            if (!dummyGroup.parent) return; // Aborted!
                            
                            const tex = new THREE.Texture(bmp);
                            tex.colorSpace = THREE.SRGBColorSpace;
                            tex.needsUpdate = true;
                            
                            // Calculate palette
                            const canvas = document.createElement('canvas');
                            canvas.width = 16; canvas.height = 16;
                            const ctx = canvas.getContext('2d', { willReadFrequently: true });
                            ctx.drawImage(bmp, 0, 0, 16, 16);
                            const data = ctx.getImageData(0, 0, 16, 16).data;
                            let r = 0, g = 0, b = 0, count = 0;
                            for (let i = 0; i < data.length; i += 4) {
                                r += data[i]; g += data[i+1]; b += data[i+2]; count++;
                            }
                            const avgR = Math.floor(r / count);
                            const avgG = Math.floor(g / count);
                            const avgB = Math.floor(b / count);
                            const luminance = 0.2126 * (avgR/255) + 0.7152 * (avgG/255) + 0.0722 * (avgB/255);
                            const isLight = luminance > 0.45;
                            const palette = {
                                bg: `rgb(${avgR}, ${avgG}, ${avgB})`,
                                text: isLight ? '#111111' : '#ffffff',
                                subtext: isLight ? '#333333' : '#cccccc',
                                divider: isLight ? '#999999' : '#333333'
                            };
                            
                            // Generate high-res back/spine
                            const backTex = createBackCoverTexture(fetchedItem, palette, STORE_DESIGN);
                            const spineTex = createSpineTexture(fetchedItem, palette, STORE_DESIGN);
                            
                            const dynamicBackMat = new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.5 });
                            dynamicBackMat.userData.isDynamicSleeve = true;
                            backMesh.material = dynamicBackMat;
                            
                            const dynamicSpineMat = new THREE.MeshStandardMaterial({ map: spineTex, roughness: 0.5 });
                            dynamicSpineMat.userData.isDynamicSleeve = true;
                            spineMesh.material = dynamicSpineMat;
                            
                            const solidSleeveMat = new THREE.MeshStandardMaterial({ color: palette.bg, roughness: 0.5 });
                            solidSleeveMat.userData.isDynamicSleeve = true;
                            const rSpine = dummyGroup.children.find(c => c.name === 'right_spine');
                            const tMesh = dummyGroup.children.find(c => c.name === 'top');
                            if (rSpine) rSpine.material = solidSleeveMat;
                            if (tMesh) tMesh.material = solidSleeveMat;
                            
                            const frontMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 });
                            const frontMesh = new THREE.Mesh(sharedFrontGeo, frontMat);
                            frontMesh.position.z = halfDepth + 0.001;
                            frontMesh.name = 'front';
                            frontMesh.userData = { isDynamicFront: true };
                            dummyGroup.add(frontMesh);
                            
                        }).catch(() => {
                            const frontMesh = new THREE.Mesh(sharedFrontGeo, fallbackFrontMat);
                            frontMesh.position.z = halfDepth + 0.001;
                            frontMesh.name = 'front';
                            dummyGroup.add(frontMesh);
                        });
                    }
                    
                    // Attach to avatar (floating slightly in front and tilted up)
                    dummyGroup.position.set(0, 6.9, -1.2); 
                    dummyGroup.rotation.x = -0.2; 
                    p.mesh.add(dummyGroup);
                }

                function applyDrop(playerId, itemId) {
                    const p = networkedPlayers.get(playerId);
                    
                    if (p) {
                        const dummyGroup = p.mesh.children.find(c => c.name === "held_item_" + itemId);
                        if (dummyGroup) {
                            const frontMesh = dummyGroup.children.find(c => c.name === 'front');
                            if (frontMesh && frontMesh.userData && frontMesh.userData.isDynamicFront && frontMesh.material) {
                                if (frontMesh.material.map) frontMesh.material.map.dispose();
                                frontMesh.material.dispose();
                            }
                            dummyGroup.children.forEach(child => {
                                if (child.material && child.material.userData && child.material.userData.isDynamicSleeve) {
                                    if (child.material.map) child.material.map.dispose();
                                    child.material.dispose();
                                }
                            });
                            p.mesh.remove(dummyGroup);
                        }
                    }

                    // Unlock the movie on our local shelf
                    networkHeldItems.delete(itemId);
                    let group = movieMeshMap.get(itemId);
                    if (!group) {
                        for (const g of movieMeshMap.values()) {
                            if (g.userData && g.userData.item && g.userData.item.Id === itemId) {
                                group = g;
                                break;
                            }
                        }
                    }
                    if (group) group.visible = true;
                }

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'ROOM_STATE') {
                        // Spawn existing players
                        const playersList = data.payload.players || data.payload; // Fallback in case of old server
                        Object.keys(playersList).forEach(id => {
                            const p = playersList[id];
                            const avatar = createAvatar(p.username, p.userId);
                            avatar.position.set(p.x, 0, p.z);
                            avatar.rotation.y = p.rotY;
                            networkedPlayers.set(id, { 
                                mesh: avatar, 
                                targetPosition: new THREE.Vector3(p.x, 0, p.z),
                                targetQuaternion: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), p.rotY)
                            });
                            if (p.heldItem) applyInspect(id, p.heldItem);
                        });
                    }
                    else if (data.type === 'USER_JOINED') {
                        const p = data.payload;
                        const avatar = createAvatar(p.username, p.userId);
                        avatar.position.set(p.x, 0, p.z);
                        networkedPlayers.set(p.id, { 
                            mesh: avatar, 
                            targetPosition: new THREE.Vector3(p.x, 0, p.z),
                            targetQuaternion: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), p.rotY)
                        });
                        if (p.heldItem) applyInspect(p.id, p.heldItem);
                    }
                    else if (data.type === 'USER_MOVED') {
                        const p = networkedPlayers.get(data.payload.id);
                        if (p) {
                            p.targetPosition.set(data.payload.x, 0, data.payload.z);
                            p.targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), data.payload.rotY);
                        }
                    }
                    else if (data.type === 'USER_LEFT') {
                        const p = networkedPlayers.get(data.payload.id);
                        if (p) {
                            scene.remove(p.mesh);
                            // DO NOT dispose geometries here, they are shared!
                            networkedPlayers.delete(data.payload.id);
                        }
                    }
                    else if (data.type === 'USER_INSPECT') {
                        applyInspect(data.payload.id, data.payload.itemId);
                    }
                    else if (data.type === 'USER_DROP') {
                        applyDrop(data.payload.id, data.payload.itemId);
                    }
                };
                } catch(e) {
                    console.error("Multiplayer connection failed", e);
                }
            }
            connectWS();

            // --- State Machine & Inspection ---
            const STATE = { BROWSE: 0, INSPECT: 1, PLAYING: 2 };
            let currentState = STATE.BROWSE;
            let inspectedMesh = null;
            let originalPosition = new THREE.Vector3();
            let originalRotation = new THREE.Euler();

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredMesh = null;

            // --- Input Handling (Gyroscopic Look, Inspect, Move) ---
            let isDragging = false;
            let dragDistance = 0;
            let previousMousePosition = { x: 0, y: 0 };
            let targetSpin = 0;
            let currentSpin = 0;

            function onPointerDown(clientX, clientY) {
                if (settingsOpen()) return;
                isDragging = true;
                dragDistance = 0;
                previousMousePosition = { x: clientX, y: clientY };
                if (currentState === STATE.INSPECT && inspectedMesh) {
                    document.body.style.cursor = 'grabbing';
                }
            }

            function onPointerMove(clientX, clientY) {
                if (settingsOpen()) return;
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                if (isDragging) {
                    const deltaX = clientX - previousMousePosition.x;
                    const deltaY = clientY - previousMousePosition.y;
                    dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

                    if (currentState === STATE.INSPECT && inspectedMesh) {
                        targetSpin += deltaX * 0.01;
                    } else if (currentState === STATE.BROWSE) {
                        cameraYaw += deltaX * 0.005;
                        cameraPitch += deltaY * 0.005;
                        cameraPitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, cameraPitch));
                        camera.rotation.y = cameraYaw;
                        camera.rotation.x = cameraPitch;
                    }
                    previousMousePosition = { x: clientX, y: clientY };
                }
            }

            function onPointerUp() {
                isDragging = false;
                if (currentState === STATE.INSPECT && inspectedMesh) {
                    document.body.style.cursor = 'grab';
                    const halfTurns = Math.round(targetSpin / Math.PI);
                    targetSpin = halfTurns * Math.PI;
                }
            }

            window.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('wheel', (e) => {
                if (settingsOpen()) return;
                // Smooth trackpad zooming and mouse wheel zooming
                targetFov = Math.max(20, Math.min(80, targetFov + e.deltaY * 0.02));
            }, { passive: true });

            window.addEventListener('touchstart', (e) => onPointerDown(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            window.addEventListener('touchmove', (e) => onPointerMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            window.addEventListener('touchend', onPointerUp);

            const settingsOpen = () => document.getElementById('settings-modal').style.display === 'block';
            window.addEventListener('click', (e) => {
                if (settingsOpen()) return;
                if (currentState === STATE.BROWSE) {
                    if (dragDistance > 10) return; // It was a pan, not a click

                    if (hoveredMesh && hoveredMesh.userData) {
                        if (hoveredMesh.userData.isExit) {
                            parent.postMessage({ type: 'EXIT' }, '*');
                            return;
                        } else if (hoveredMesh.userData.isNode) {
                            // Clicked a floor node to walk
                            targetCameraX = hoveredMesh.userData.targetX;
                            targetCameraZ = hoveredMesh.userData.targetZ;
                            targetFov = 60; // Reset zoom
                        } else if (hoveredMesh.userData.isCase) {
                            targetFov = 60; // Reset zoom

                            // Check distance
                            const caseWorldPos = new THREE.Vector3();
                            hoveredMesh.getWorldPosition(caseWorldPos);

                            const dx = camera.position.x - caseWorldPos.x;
                            const dz = camera.position.z - caseWorldPos.z;
                            const dist2D = Math.sqrt(dx*dx + dz*dz);

                            if (dist2D > 12) {
                                // Find where the user should stand to look at this movie (4 units in front of it)
                                const caseWorldQuat = new THREE.Quaternion();
                                hoveredMesh.getWorldQuaternion(caseWorldQuat);
                                const interactionPoint = new THREE.Vector3(0, 0, 4);
                                interactionPoint.applyQuaternion(caseWorldQuat);
                                interactionPoint.add(caseWorldPos);

                                // Find the nearest node to that optimal standing spot
                                let nearestNode = nodes[0];
                                let minDist = Infinity;
                                for (let node of nodes) {
                                    const nd = Math.sqrt(Math.pow(node.position.x - interactionPoint.x, 2) + Math.pow(node.position.z - interactionPoint.z, 2));
                                    if (nd < minDist) {
                                        minDist = nd;
                                        nearestNode = node;
                                    }
                                }
                                targetCameraX = nearestNode.userData.targetX;
                                targetCameraZ = nearestNode.userData.targetZ;
                                return; // Skip inspection for now, they are just walking over to it
                            }

                            // Clicked a movie to inspect (Close enough)
                            currentState = STATE.INSPECT;
                            inspectedMesh = hoveredMesh;

                            // Lazily generate the back and spine textures the very first time the user picks up this specific movie
                            if (!inspectedMesh.userData.hasBackCover) {
                                const item = inspectedMesh.userData.item;
                                const bitmap = inspectedMesh.userData.bitmap;
                                let palette = inspectedMesh.userData.palette;

                                if (!palette && bitmap) {
                                    // Extract color ON DEMAND if background task hasn't reached it yet!
                                    const tinyCanvas = document.createElement('canvas');
                                    tinyCanvas.width = 16;
                                    tinyCanvas.height = 16;
                                    const tinyCtx = tinyCanvas.getContext('2d');
                                    tinyCtx.drawImage(bitmap, 0, 0, 16, 16);
                                    const pixels = tinyCtx.getImageData(0, 0, 16, 16).data;

                                    let r = 0, g = 0, b = 0, count = 0;
                                    for (let i = 0; i < pixels.length; i += 4) {
                                        r += pixels[i]; g += pixels[i+1]; b += pixels[i+2]; count++;
                                    }

                                    const avgR = Math.floor(r / count);
                                    const avgG = Math.floor(g / count);
                                    const avgB = Math.floor(b / count);
                                    const bgColor = `rgb(${avgR}, ${avgG}, ${avgB})`;

                                    const luminance = 0.2126 * (avgR/255) + 0.7152 * (avgG/255) + 0.0722 * (avgB/255);
                                    const isLight = luminance > 0.45;

                                    palette = {
                                        bg: bgColor,
                                        text: isLight ? '#111111' : '#ffffff',
                                        subtext: isLight ? '#333333' : '#cccccc',
                                        divider: isLight ? '#999999' : '#333333'
                                    };
                                }

                                const backTex = createBackCoverTexture(item, palette, STORE_DESIGN);
                                const spineTex = createSpineTexture(item, palette, STORE_DESIGN);
                                inspectedMesh.userData.backTex = backTex;
                                inspectedMesh.userData.spineTex = spineTex;

                                const backPlane = inspectedMesh.getObjectByName('back');
                                if (backPlane) {
                                    if (!inspectedMesh.userData.shelfBackMat) inspectedMesh.userData.shelfBackMat = backPlane.material;
                                    backPlane.material = backPlane.material.clone();
                                    backPlane.material.map = backTex;
                                    backPlane.material.color.setHex(0xffffff);
                                    backPlane.material.needsUpdate = true;
                                }

                                const spinePlane = inspectedMesh.getObjectByName('spine');
                                if (spinePlane) {
                                    if (!inspectedMesh.userData.shelfSpineMat) inspectedMesh.userData.shelfSpineMat = spinePlane.material;
                                    spinePlane.material = spinePlane.material.clone();
                                    spinePlane.material.map = spineTex;
                                    spinePlane.material.color.setHex(0xffffff);
                                    spinePlane.material.needsUpdate = true;
                                }

                                const rightSpinePlane = inspectedMesh.getObjectByName('right_spine');
                                if (rightSpinePlane) {
                                    if (!inspectedMesh.userData.shelfRightSpineMat) inspectedMesh.userData.shelfRightSpineMat = rightSpinePlane.material;
                                    rightSpinePlane.material = rightSpinePlane.material.clone();
                                    rightSpinePlane.material.color.set(palette.bg);
                                    rightSpinePlane.material.needsUpdate = true;
                                }

                                const topPlane = inspectedMesh.getObjectByName('top');
                                if (topPlane) {
                                    if (!inspectedMesh.userData.shelfTopMat) inspectedMesh.userData.shelfTopMat = topPlane.material;
                                    topPlane.material = topPlane.material.clone();
                                    topPlane.material.color.set(palette.bg);
                                    topPlane.material.needsUpdate = true;
                                }

                                inspectedMesh.userData.hasBackCover = true;
                            }

                            const frontPlane = inspectedMesh.getObjectByName('front');

                            // Temporarily change roughness to matte to prevent glare from washing out the HD cover
                            if (frontPlane) {
                                // Clone material because it might be the shared fallback material!
                                if (!inspectedMesh.userData.isFrontCloned) {
                                    frontPlane.material = frontPlane.material.clone();
                                    inspectedMesh.userData.isFrontCloned = true;
                                }
                                frontPlane.material.roughness = 0.9;
                                frontPlane.material.needsUpdate = true;

                                // High-Res Image Swap
                                if (!inspectedMesh.userData.lowResMap) {
                                    inspectedMesh.userData.lowResMap = frontPlane.material.map;
                                }
                            }

                            const currentMesh = inspectedMesh;
                            const itemId = currentMesh.userData.item.Id;
                            const highResUrl = `${jfServer}/Items/${itemId}/Images/Primary?maxWidth=1024&quality=90`;

                            fetch(highResUrl, { headers: { 'X-Emby-Token': jfToken } })
                                .then(res => res.blob())
                                .then(blob => createImageBitmap(blob, { imageOrientation: 'flipY' }))
                                .then(bmp => {
                                    // Only swap if they are still holding THIS specific movie
                                    if (inspectedMesh === currentMesh && currentState === STATE.INSPECT) {
                                        const highResTex = new THREE.Texture(bmp);
                                        highResTex.colorSpace = THREE.SRGBColorSpace;
                                        highResTex.needsUpdate = true;

                                        const cFront = currentMesh.getObjectByName('front');
                                        if (cFront) {
                                            cFront.material.map = highResTex;
                                            cFront.material.needsUpdate = true;
                                        }
                                        currentMesh.userData.highResMap = highResTex;
                                    } else {
                                        // They already put it back, so cache it in userData for next time they pick it up
                                        const highResTex = new THREE.Texture(bmp);
                                        highResTex.colorSpace = THREE.SRGBColorSpace;
                                        highResTex.needsUpdate = true;
                                        currentMesh.userData.highResMap = highResTex;
                                    }
                                }).catch(e => console.error(e));

                            // If it already loaded from a previous inspect, swap it instantly!
                            if (currentMesh.userData.highResMap) {
                                const cFront = currentMesh.getObjectByName('front');
                                if (cFront) {
                                    cFront.material.map = currentMesh.userData.highResMap;
                                    cFront.material.needsUpdate = true;
                                }
                            }

                            originalPosition.copy(inspectedMesh.position);
                            originalRotation.copy(inspectedMesh.rotation);
                            inspectedMesh.userData.originalParent = inspectedMesh.parent;

                            scene.attach(inspectedMesh);

                            const targetWorldPos = new THREE.Vector3();
                            targetWorldPos.copy(camera.position);
                            // Move it forward relative to camera's current rotation
                            const forward = new THREE.Vector3(0, 0, -2);
                            forward.applyQuaternion(camera.quaternion);
                            targetWorldPos.add(forward);

                            // Align rotation perfectly with camera
                            inspectedMesh.position.copy(targetWorldPos);
                            inspectedMesh.quaternion.copy(camera.quaternion);
                            const vg = inspectedMesh.getObjectByName('visualGroup');
                            if (vg) vg.position.set(0, 0, 0);

                            targetSpin = 0;
                            currentSpin = 0;

                            selectedItem = inspectedMesh.userData;
                            hudTitle.innerText = selectedItem.title || selectedItem.name;
                            hud.classList.add('show');
                            document.body.style.cursor = 'grab';

                            // --- Multiplayer: Broadcast INSPECT ---
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(JSON.stringify({
                                    type: 'INSPECT',
                                    payload: { itemId: inspectedMesh.userData.id }
                                }));
                            }
                        }
                    }
                } else if (currentState === STATE.INSPECT) {
                    if (dragDistance > 10) return;

                    currentState = STATE.BROWSE;

                    const frontPlane = inspectedMesh.getObjectByName('front');
                    if (frontPlane) {
                        // Dispose of the high-res texture to free GPU memory!
                        if (inspectedMesh.userData.highResMap) {
                            inspectedMesh.userData.highResMap.dispose();
                            delete inspectedMesh.userData.highResMap;
                        }
                        if (inspectedMesh.userData.backTex) {
                            inspectedMesh.userData.backTex.dispose();
                            delete inspectedMesh.userData.backTex;
                            inspectedMesh.userData.hasBackCover = false; // Force regen next time
                        }
                        if (inspectedMesh.userData.spineTex) {
                            inspectedMesh.userData.spineTex.dispose();
                            delete inspectedMesh.userData.spineTex;
                        }
                        const backPlane = inspectedMesh.getObjectByName('back');
                        if (backPlane && inspectedMesh.userData.shelfBackMat) {
                            backPlane.material.dispose();
                            backPlane.material = inspectedMesh.userData.shelfBackMat;
                        }
                        const spinePlane = inspectedMesh.getObjectByName('spine');
                        if (spinePlane && inspectedMesh.userData.shelfSpineMat) {
                            spinePlane.material.dispose();
                            spinePlane.material = inspectedMesh.userData.shelfSpineMat;
                        }
                        const rSpine = inspectedMesh.getObjectByName('right_spine');
                        if (rSpine && inspectedMesh.userData.shelfRightSpineMat) {
                            rSpine.material.dispose();
                            rSpine.material = inspectedMesh.userData.shelfRightSpineMat;
                        }
                        const tPlane = inspectedMesh.getObjectByName('top');
                        if (tPlane && inspectedMesh.userData.shelfTopMat) {
                            tPlane.material.dispose();
                            tPlane.material = inspectedMesh.userData.shelfTopMat;
                        }

                        if (inspectedMesh.userData.lowResMap) {
                            frontPlane.material.map = inspectedMesh.userData.lowResMap;
                        }
                        // Restore cardboard look for the shelf
                        frontPlane.material.roughness = 0.8;
                        frontPlane.material.needsUpdate = true;
                    }

                    inspectedMesh.userData.originalParent.attach(inspectedMesh);
                    inspectedMesh.position.copy(originalPosition);
                    inspectedMesh.rotation.copy(originalRotation);
                    
                    // --- Multiplayer: Broadcast DROP ---
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'DROP',
                            payload: { itemId: inspectedMesh.userData.id }
                        }));
                    }

                    inspectedMesh = null;
                    selectedItem = null;
                    hud.classList.remove('show');
                    document.body.style.cursor = 'default';
                }
            });

            hudPlay.addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedItem && inspectedMesh) {
                    currentState = STATE.PLAYING;
                    hud.classList.remove('show');
                    document.body.style.cursor = 'default';

                    // --- Multiplayer: Broadcast DROP since they are leaving ---
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'DROP',
                            payload: { itemId: inspectedMesh.userData.id }
                        }));
                    }

                    // Black overlay to fade out
                    const overlay = document.createElement('div');
                    overlay.style.position = 'absolute';
                    overlay.style.top = '0'; overlay.style.left = '0';
                    overlay.style.width = '100vw'; overlay.style.height = '100vh';
                    overlay.style.backgroundColor = 'black';
                    overlay.style.opacity = '0';
                    overlay.style.transition = 'opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                    overlay.style.pointerEvents = 'none';
                    overlay.style.zIndex = '9999';
                    document.body.appendChild(overlay);

                    const startRotY = inspectedMesh.rotation.y;
                    // Rotate counter-clockwise so the right edge (cover) swings forward and left
                    const endRotY = startRotY + Math.PI / 1.2;
                    const startPos = inspectedMesh.position.clone();

                    // Move the center of the box to the right and very close to the camera,
                    // so the swinging front cover perfectly slices through the viewport!
                    const targetWorldPos = new THREE.Vector3(1.2, 0, -0.8);
                    targetWorldPos.applyMatrix4(camera.matrixWorld);

                    let startTime = null;
                    const duration = 800;

                    setTimeout(() => overlay.style.opacity = '1', 50);

                    function playAnim(time) {
                        if (!startTime) startTime = time;
                        const progress = Math.min((time - startTime) / duration, 1);

                        // Smooth cubic ease for a cinematic feel
                        const ease = progress * progress * (3 - 2 * progress);

                        inspectedMesh.rotation.y = startRotY + (endRotY - startRotY) * ease;
                        inspectedMesh.position.lerpVectors(startPos, targetWorldPos, ease);

                        if (progress < 1) {
                            requestAnimationFrame(playAnim);
                        } else {
                            parent.postMessage({ type: 'OPEN_DETAILS', payload: { itemId: selectedItem.item.Id } }, '*');
                        }
                    }
                    requestAnimationFrame(playAnim);
                }
            });

            let rafId;
            let lastIntersection = null;
            let lastRaycastTime = 0;
            
            let lastNetworkSend = 0;
            const NETWORK_SEND_INTERVAL = 66; // ~15 FPS
            const clock = new THREE.Clock();

            function animate(time) {
                rafId = requestAnimationFrame(animate);
                const dt = clock.getDelta();

                const camLerp = 1 - Math.exp(-5.0 * dt);
                
                // Always lerp FOV to targetFov (so we reset if zoomed in and clicked)
                if (Math.abs(targetFov - camera.fov) > 0.1) {
                    camera.fov += (targetFov - camera.fov) * camLerp;
                    camera.updateProjectionMatrix();
                }

                if (currentState === STATE.BROWSE) {
                    currentCameraX += (targetCameraX - currentCameraX) * camLerp;
                    camera.position.x = currentCameraX;
                    currentCameraZ += (targetCameraZ - currentCameraZ) * camLerp;
                    camera.position.z = currentCameraZ;

                    

                    // Throttle raycasting to ~30 FPS to save CPU
                    if (time - lastRaycastTime > 33) {
                        lastRaycastTime = time;
                        raycaster.setFromCamera(mouse, camera);
                        const intersects = raycaster.intersectObjects(interactableMeshes, true);
                        lastIntersection = intersects.length > 0 ? intersects[0] : null;
                    }
                    
                    // Multiplayer Broadcasting
                    if (ws && ws.readyState === WebSocket.OPEN && (time - lastNetworkSend > NETWORK_SEND_INTERVAL)) {
                        lastNetworkSend = time;
                        ws.send(JSON.stringify({
                            type: 'MOVE',
                            payload: { x: currentCameraX, z: currentCameraZ, rotY: cameraYaw }
                        }));
                    }

                    if (lastIntersection) {
                        let hit = lastIntersection.object;

                        if (hit.userData && hit.userData.parentGroup) { hit = hit.userData.parentGroup; }

                        // Raycaster ignores `visible`, so exclude held cases manually
                        if (hit && hit.userData && hit.userData.isCase && (networkHeldItems.has(hit.userData.id) || hit.visible === false)) {
                            hit = null;
                        }

                        if (hoveredMesh !== hit) {
                            // Reset previous hovered mesh
                            if (hoveredMesh) {
                                if (hoveredMesh.userData.isCase) {
                                    const vg = hoveredMesh.getObjectByName('visualGroup');
                                    if (vg) vg.position.set(0, 0, 0);
                                } else if (hoveredMesh.userData.isNode) hoveredMesh.material.opacity = 0.4;
                                else if (hoveredMesh.userData.isExit) hoveredMesh.material.opacity = 0.3;
                            }

                            // Set new hovered mesh
                            hoveredMesh = hit;
                            if (hoveredMesh) {
                                if (hoveredMesh.userData.isCase) {
                                    const vg = hoveredMesh.getObjectByName('visualGroup');
                                    if (vg) {
                                        vg.position.set(0, 0, 0);
                                        vg.translateZ(0.2); // Pops out locally from gondola
                                    }
                                    document.body.style.cursor = 'pointer';
                                }
                                else if (hoveredMesh.userData.isNode) {
                                    hoveredMesh.material.opacity = 0.9;
                                    document.body.style.cursor = 'pointer';
                                }
                                else if (hoveredMesh.userData.isExit) {
                                    hoveredMesh.material.opacity = 0.7;
                                    document.body.style.cursor = 'pointer';
                                }
                                else {
                                    document.body.style.cursor = 'default';
                                }
                            } else {
                                document.body.style.cursor = 'default';
                            }
                        }
                    } else if (hoveredMesh !== null) {
                        if (hoveredMesh.userData.isCase) {
                            const vg = hoveredMesh.getObjectByName('visualGroup');
                            if (vg) vg.position.set(0, 0, 0);
                        }
                        else if (hoveredMesh.userData.isNode) hoveredMesh.material.opacity = 0.4;
                        else if (hoveredMesh.userData.isExit) hoveredMesh.material.opacity = 0.3;
                        hoveredMesh = null;
                        document.body.style.cursor = 'default';
                    }
                } else if (currentState === STATE.INSPECT && inspectedMesh) {
                    // Lock position relative to camera in world space
                    const targetWorldPos = new THREE.Vector3();
                    targetWorldPos.copy(camera.position);
                    const forward = new THREE.Vector3(0, 0, -2);
                    forward.applyQuaternion(camera.quaternion);
                    targetWorldPos.add(forward);

                    inspectedMesh.position.copy(targetWorldPos);

                    // Smoothly interpolate rotation to target
                    const spinLerp = 1 - Math.exp(-10.0 * dt);
                    currentSpin += (targetSpin - currentSpin) * spinLerp;

                    const baseQuat = new THREE.Quaternion().copy(camera.quaternion);
                    const spinQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), currentSpin);

                    // Multiply them: this perfectly spins the movie on its vertical axis RELATIVE to the screen
                    inspectedMesh.quaternion.copy(baseQuat).multiply(spinQuat);
                }

                // Interpolate networked avatars (frame-rate independent)
                networkedPlayers.forEach(avatar => {
                    const lerpFactor = 1 - Math.exp(-8.0 * dt);
                    avatar.mesh.position.lerp(avatar.targetPosition, lerpFactor);
                    avatar.mesh.quaternion.slerp(avatar.targetQuaternion, lerpFactor);
                    
                    const dx = camera.position.x - avatar.mesh.position.x;
                    const dz = camera.position.z - avatar.mesh.position.z;
                    const dist2D = Math.sqrt(dx*dx + dz*dz);
                    
                    if (dist2D < 1.0) {
                        avatar.mesh.visible = false;
                    } else {
                        avatar.mesh.visible = true;
                    }
                });

                renderer.render(scene, camera);
            }
            animate();

            const onResize = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };
            window.addEventListener('resize', onResize);

            cleanup3D = () => {
                movieMeshMap.clear();
                networkHeldItems.clear();
                wsIntentionallyClosed = true;
                if (ws) {
                    ws.onclose = null;
                    ws.close();
                }
                cancelAnimationFrame(rafId);
                window.removeEventListener('resize', onResize);
                scene.traverse((o) => {
                    if (o.isMesh) {
                        o.geometry.dispose();
                        if (Array.isArray(o.material)) {
                            o.material.forEach(m => { m.map?.dispose(); m.dispose(); });
                        } else {
                            o.material.map?.dispose();
                            o.material.dispose();
                        }
                    }
                });
                renderer.dispose();
                renderer.forceContextLoss();
                document.body.removeChild(renderer.domElement);

                textureCache.forEach(promise => {
                    promise.then(data => {
                        if (data && data.texture) data.texture.dispose();
                        if (data && data.bitmap) data.bitmap.close(); // Frees native memory
                    });
                });
                textureCache.clear();
            };
        }

        window.addEventListener('pagehide', () => {
            cleanup3D();
        });
    </script>
</body>
</html>

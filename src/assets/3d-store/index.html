<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfin 3D Store</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0d; /* Dark theme default */
            color: #f4f1ea;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        #hud {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 20;
            background: #4b0082; /* Purple */
            border: 4px solid #FDDA0D; /* Yellow */
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #hud.show {
            display: block;
        }
        #hud-title {
            margin: 0 0 15px 0;
            font-size: 24px;
            font-weight: 800;
            font-style: italic;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #hud-play {
            background: #FDDA0D;
            color: #4b0082;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: transform 0.1s, background 0.2s;
        }
        #hud-play:hover {
            background: #fff04d;
            transform: scale(1.05);
        }
        #hud-play:active {
            transform: scale(0.95);
        }
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b0b0d;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <h3 id="loading-text">Loading shelves...</h3>
    </div>

    
    <div id="settings-btn" style="position: absolute; top: 20px; right: 20px; z-index: 100; cursor: pointer; font-size: 24px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; user-select: none;">⚙️</div>
    <div id="settings-modal" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; color: white; padding: 30px; border-radius: 12px; z-index: 101; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #333; min-width: 250px;">
        <h2 style="margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px;">Store Settings</h2>
        <div style="margin: 20px 0;">
            <label style="display: block; margin-bottom: 5px;">Case Style</label>
            <select id="setting-design" style="width: 100%; padding: 8px; background: #333; color: white; border: none; border-radius: 4px;">
                <option value="dvd">DVD (Classic)</option>
                <option value="vhs">VHS (Retro)</option>
            </select>
        </div>
        <div style="margin: 20px 0;">
            <label style="display: block; margin-bottom: 5px;">Network Mode</label>
            <select id="setting-mode" style="width: 100%; padding: 8px; background: #333; color: white; border: none; border-radius: 4px;">
                <option value="multiplayer">Multiplayer</option>
                <option value="singleplayer">Singleplayer</option>
            </select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px;">
            <button id="setting-cancel" style="padding: 8px 16px; background: transparent; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer;">Cancel</button>
            <button id="setting-save" style="padding: 8px 16px; background: #00a4dc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save & Reload</button>
        </div>
    </div>
    <div id="hud">

        <h2 id="hud-title">Title</h2>
        <button id="hud-play">Play</button>
    </div>

    <script type="module">
        import * as THREE from './vendor/three.module.min.js';
        import { createBackCoverTexture, createSpineTexture } from './textures.js';
        import { createRoundedPlane } from './geometry.js';


        // --- DEBUG HUD ---
        const debugDiv = document.createElement('div');
        debugDiv.style.position = 'absolute';
        debugDiv.style.top = '10px';
        debugDiv.style.left = '10px';
        debugDiv.style.color = '#ff4444';
        debugDiv.style.zIndex = '9999';
        debugDiv.style.background = 'rgba(0,0,0,0.8)';
        debugDiv.style.padding = '10px';
        debugDiv.style.fontFamily = 'monospace';
        debugDiv.style.pointerEvents = 'none';
        debugDiv.style.maxWidth = '400px';
        debugDiv.style.wordWrap = 'break-word';
        document.body.appendChild(debugDiv);
        
        window.logDebug = function(msg) {
            debugDiv.innerText += msg + '\n';
            console.log("[DEBUG]", msg);
        };
        
        window.addEventListener('error', function(e) {
            window.logDebug("Global Error: " + e.message + " at " + e.filename + ":" + e.lineno);
        });
        window.addEventListener('unhandledrejection', function(e) {
            window.logDebug("Unhandled Promise: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
        // -----------------

        let jfToken = null;
        let jfUserId = null;
        let jfServer = null;

        // Tell the parent we are ready to receive the auth token
        parent.postMessage({ type: 'READY' }, '*');

        window.addEventListener('message', (event) => {
            // In a real prod setup, validate event.origin here.
            // For now we accept the token.
            if (event.data && event.data.type === 'AUTH') {
                jfToken = event.data.payload.token;
                jfServer = event.data.payload.serverUrl;
                jfUserId = event.data.payload.userId;
                if (event.data.payload.username) myUsername = event.data.payload.username;
                console.log("3D Store received AUTH. Token:", jfToken ? "Present" : "Missing", "Server:", jfServer, "User:", jfUserId, "Name:", myUsername);
                init3D();
            } else if (event.data && event.data.type === 'SEERR_DATA') {
                console.log("Received Seerr Data", event.data.payload);
            }
        });

        // 2. Three.js Setup (Triggered after Auth)
        let cleanup3D = () => {
                movieMeshMap.clear();
                networkHeldItems.clear();};

        // HUD Elements
        const hud = document.getElementById('hud');
        const hudTitle = document.getElementById('hud-title');
        const hudPlay = document.getElementById('hud-play');
        const loadingScreen = document.getElementById('loading-screen');
        let selectedItem = null;

        // Move network globals to the very top so they are accessible by loadData
        let ws = null;
        let myUsername = "Guest_" + Math.floor(Math.random() * 1000); 
        let networkHeldItems = new Set(); 
        const movieMeshMap = new Map();

        function hashStr(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        let isInitialized = false;
        async function init3D() {
            if (isInitialized) return;
            isInitialized = true;
            
        const STORE_DESIGN = localStorage.getItem('storeDesign') || 'vhs';
        const STORE_MODE = localStorage.getItem('storeMode') || 'multiplayer';

        document.getElementById('settings-btn').addEventListener('click', () => {
            document.getElementById('settings-modal').style.display = 'block';
            document.getElementById('setting-design').value = STORE_DESIGN;
            document.getElementById('setting-mode').value = STORE_MODE;
        });

        document.getElementById('setting-cancel').addEventListener('click', () => {
            document.getElementById('settings-modal').style.display = 'none';
        });

        document.getElementById('setting-save').addEventListener('click', () => {
            localStorage.setItem('storeDesign', document.getElementById('setting-design').value);
            localStorage.setItem('storeMode', document.getElementById('setting-mode').value);
            location.reload();
        });

        const scene = new THREE.Scene();

            scene.background = new THREE.Color(0x111111);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8.5, 14);
            // Initial tilt will be set by cameraPitch in the state block

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // Standard "Retail" Lighting (Bright and even)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const overheadLight = new THREE.DirectionalLight(0xffffff, 0.8);
            overheadLight.position.set(0, 8, 3);
            scene.add(overheadLight);

            // Procedural Carpet Texture (90s Arcade / Cinema)
            function createFloorTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // Dark indigo base
                ctx.fillStyle = '#161625';
                ctx.fillRect(0, 0, 512, 512);

                // 1. Get the pixel data array
                const imgData = ctx.getImageData(0, 0, 512, 512);
                const data = imgData.data;
                const colors = [[233,69,96], [108,99,255], [0,210,255], [255,101,132]];

                // 2. Manipulate pixels directly (No fillRect!)
                for (let i = 0; i < data.length; i += 4) {
                    // Carpet noise
                    const noise = (Math.random() - 0.5) * 35;
                    data[i] = Math.max(0, Math.min(255, data[i] + noise));
                    data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise));
                    data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise));

                    // 3000 specks is roughly 1.1% of 262,144 pixels
                    if (Math.random() < 0.011) {
                        const c = colors[Math.floor(Math.random() * colors.length)];
                        data[i] = c[0]; data[i+1] = c[1]; data[i+2] = c[2];
                    }
                }

                // 3. Put the modified data back onto the canvas
                ctx.putImageData(imgData, 0, 0);

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(15, 15);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                return tex;
            }

            // Procedural Drop Ceiling Texture (with 2x4 Fluorescent Lights)
            function createCeilingTexture() {
                const TILE_SIZE = 512;
                const canvas = document.createElement('canvas');
                canvas.width = TILE_SIZE * 3;  // 1536 (3x3 grid of tiles)
                canvas.height = TILE_SIZE * 3; // 1536
                const ctx = canvas.getContext('2d');

                // Base white color
                ctx.fillStyle = '#eeeeee';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Helper to draw acoustic dots via ImageData (MUCH FASTER)
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                // 1500 dots per tile * 7 tiles = 10500 dots total
                // 1536 * 1536 = 2,359,296 pixels total
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        // Skip the fluorescent light (Row 1, Cols 1 & 2)
                        if (r === 1 && (c === 1 || c === 2)) continue;

                        const startX = c * TILE_SIZE;
                        const startY = r * TILE_SIZE;

                        for (let i = 0; i < 1500; i++) {
                            const dx = Math.floor(Math.random() * TILE_SIZE);
                            const dy = Math.floor(Math.random() * TILE_SIZE);
                            // Set a 3x3 block of pixels (roughly)
                            for (let pY = 0; pY < 3; pY++) {
                                for (let pX = 0; pX < 3; pX++) {
                                    const pxX = startX + dx + pX;
                                    const pxY = startY + dy + pY;
                                    if (pxX < canvas.width && pxY < canvas.height) {
                                        const idx = (pxY * canvas.width + pxX) * 4;
                                        data[idx] = data[idx] * 0.9; // Darken R
                                        data[idx+1] = data[idx+1] * 0.9; // Darken G
                                        data[idx+2] = data[idx+2] * 0.9; // Darken B
                                    }
                                }
                            }
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                ctx.strokeStyle = '#aaaaaa';
                ctx.lineWidth = 12;

                // Draw the 9 grid squares
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }

                // Draw the 2-tile-length Rectangular Fluorescent Light! (Row 1, Cols 1 & 2)
                const lightX = TILE_SIZE;
                const lightY = TILE_SIZE;
                const lightW = TILE_SIZE * 2;
                const lightH = TILE_SIZE;

                // Metal frame around the light
                ctx.fillStyle = '#dddddd';
                ctx.fillRect(lightX + 10, lightY + 10, lightW - 20, lightH - 20);
                ctx.strokeStyle = '#888888';
                ctx.lineWidth = 4;
                ctx.strokeRect(lightX + 10, lightY + 10, lightW - 20, lightH - 20);

                // Glowing diffuser lens
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(lightX + 25, lightY + 25, lightW - 50, lightH - 50);

                // Diffuser grid pattern
                ctx.strokeStyle = '#f8f8f8';
                ctx.lineWidth = 2;
                for (let i = lightX + 25; i < lightX + lightW - 25; i += 12) {
                    ctx.beginPath(); ctx.moveTo(i, lightY + 25); ctx.lineTo(i, lightY + lightH - 25); ctx.stroke();
                }
                for (let i = lightY + 25; i < lightY + lightH - 25; i += 12) {
                    ctx.beginPath(); ctx.moveTo(lightX + 25, i); ctx.lineTo(lightX + lightW - 25, i); ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(5, 6.66);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

                // Create Emissive Map (Pitch black except for the light lens)
                const emCanvas = document.createElement('canvas');
                emCanvas.width = canvas.width; emCanvas.height = canvas.height;
                const emCtx = emCanvas.getContext('2d');
                emCtx.fillStyle = '#000000';
                emCtx.fillRect(0, 0, emCanvas.width, emCanvas.height);
                emCtx.fillStyle = '#ffffff'; // The part that will glow
                emCtx.fillRect(lightX + 25, lightY + 25, lightW - 50, lightH - 50);
                // Draw the diffuser grid in black so the grid lines don't glow!
                emCtx.strokeStyle = '#000000';
                emCtx.lineWidth = 2;
                for (let i = lightX + 25; i < lightX + lightW - 25; i += 12) {
                    emCtx.beginPath(); emCtx.moveTo(i, lightY + 25); emCtx.lineTo(i, lightY + lightH - 25); emCtx.stroke();
                }
                for (let i = lightY + 25; i < lightY + lightH - 25; i += 12) {
                    emCtx.beginPath(); emCtx.moveTo(lightX + 25, i); emCtx.lineTo(lightX + lightW - 25, i); emCtx.stroke();
                }
                const emTex = new THREE.CanvasTexture(emCanvas);
                emTex.wrapS = THREE.RepeatWrapping; emTex.wrapT = THREE.RepeatWrapping;
                emTex.repeat.set(5, 6.66);
                emTex.colorSpace = THREE.LinearSRGBColorSpace;
                emTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

                return { map: tex, emissiveMap: emTex };
            }

            // Physical Store Room
            // SHARED GEOMETRIES & MATERIALS (Create ONCE for performance)
            const defaultBackMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.5 });
            const defaultSpineMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.5 });
            const fallbackFrontMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.2 });
            const casePlasticMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });

            const isDvd = STORE_DESIGN === 'dvd';
            const cw = isDvd ? 0.96 : 0.89;
            const ch = isDvd ? 1.46 : 1.59;
                        const cd = isDvd ? 0.08 : 0.21;
            const bevelThickness = isDvd ? 0.01 : 0.005;
            const bevelSize = isDvd ? 0.02 : 0.005;
            const halfWidth = cw / 2 + bevelSize;
            const halfHeight = ch / 2 + bevelSize;
            const halfDepth = cd / 2 + bevelThickness;
            const sharedHitBoxGeo = new THREE.BoxGeometry(cw, ch, cd + 0.04);
            const gondolaYOffset = halfHeight - 0.70;
            const pedY = 2.51 + halfHeight;
            const caseShape = new THREE.Shape();
            const r = isDvd ? 0.05 : 0.02;
            caseShape.moveTo(-cw/2, -ch/2 + r);
            caseShape.lineTo(-cw/2, ch/2 - r);
            caseShape.quadraticCurveTo(-cw/2, ch/2, -cw/2 + r, ch/2);
            caseShape.lineTo(cw/2 - r, ch/2);
            caseShape.quadraticCurveTo(cw/2, ch/2, cw/2, ch/2 - r);
            caseShape.lineTo(cw/2, -ch/2 + r);
            caseShape.quadraticCurveTo(cw/2, -ch/2, cw/2 - r, -ch/2);
            caseShape.lineTo(-cw/2 + r, -ch/2);
            caseShape.quadraticCurveTo(-cw/2, -ch/2, -cw/2, -ch/2 + r);

            const sharedCaseGeo = new THREE.ExtrudeGeometry(caseShape, {
                depth: cd, 
                bevelEnabled: true, 
                bevelSegments: isDvd ? 3 : 1, 
                steps: 1, 
                bevelSize: isDvd ? 0.02 : 0.005, 
                bevelThickness: isDvd ? 0.01 : 0.005
            });
            sharedCaseGeo.center();

            

            const sharedFrontGeo = isDvd ? createRoundedPlane(cw, ch, 0.04) : new THREE.PlaneGeometry(cw, ch);
            const sharedBackGeo = isDvd ? createRoundedPlane(cw, ch, 0.04) : new THREE.PlaneGeometry(cw, ch);
            const spineShape = new THREE.Shape();
            const sh_hw = cd / 2;
            const sh_hh = isDvd ? ch / 2 - 0.04 : ch / 2;
            const notchDepth = 0.105;
            
            spineShape.moveTo(-sh_hw, sh_hh);
            spineShape.lineTo(sh_hw, sh_hh);
            spineShape.lineTo(sh_hw, -sh_hh);
            // Draw the thumb notch curve at the bottom
            if (STORE_DESIGN === 'vhs') {
                spineShape.quadraticCurveTo(0, -sh_hh + notchDepth, -sh_hw, -sh_hh);
            } else {
                spineShape.lineTo(-sh_hw, -sh_hh);
            }
            spineShape.lineTo(-sh_hw, sh_hh);
            
            const sharedSpineGeo = new THREE.ShapeGeometry(spineShape);
            const pos = sharedSpineGeo.attributes.position;
            const uvs = sharedSpineGeo.attributes.uv;
            for (let i = 0; i < pos.count; i++) {
                const u = (pos.getX(i) + sh_hw) / (2 * sh_hw);
                const v = (pos.getY(i) + sh_hh) / (2 * sh_hh);
                uvs.setXY(i, u, v);
            }
            uvs.needsUpdate = true;
            const sharedTopGeo = new THREE.PlaneGeometry(cw, cd);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({
                map: createFloorTexture(),
                roughness: 0.8,
                metalness: 0.0
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, -1.49, 0);
            scene.add(floor);

            // Walls and Ceiling
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xFF9E1B, roughness: 0.9, side: THREE.BackSide }); // Orange-Yellow

            const ceilingTextures = createCeilingTexture();
            const ceilingMat = new THREE.MeshStandardMaterial({
                map: ceilingTextures.map,
                emissiveMap: ceilingTextures.emissiveMap,
                emissive: 0xfff0d0, // Warm orangish-yellow 90s bulb tint!
                emissiveIntensity: 1.2,
                roughness: 1.0,
                side: THREE.BackSide
            });
            // BoxGeometry materials: Right, Left, Top, Bottom, Front, Back
            const roomMats = [wallMat, wallMat, ceilingMat, wallMat, wallMat, wallMat];

            // Raised ceiling slightly to give the exit sign more breathing room
            const wallsGeo = new THREE.BoxGeometry(60, 17.2, 65);
            const walls = new THREE.Mesh(wallsGeo, roomMats);
            walls.position.set(0, 7.1, 0);
            scene.add(walls);

            // --- Exit Doorway ---
            const doorGroup = new THREE.Group();
            doorGroup.position.set(0, 5.3, 32.4); // Placed flush against the front wall
            doorGroup.scale.set(1.44, 1.6, 1.6); // Made 10% thinner to leave room for wall posters

            // Stylized Comic-Book Glass Texture
            function createGlassTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                // Light sky blue base
                ctx.fillStyle = '#9bd4f5';
                ctx.fillRect(0, 0, 512, 1024);

                // Diagonal shines (Bottom-Left to Top-Right)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';

                // Thick stripe
                ctx.beginPath();
                ctx.moveTo(0, 800); ctx.lineTo(512, 100);
                ctx.lineTo(512, 400); ctx.lineTo(0, 1100);
                ctx.fill();

                // Thin stripe
                ctx.beginPath();
                ctx.moveTo(0, 400); ctx.lineTo(512, -300);
                ctx.lineTo(512, -150); ctx.lineTo(0, 550);
                ctx.fill();

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.4 });
            const glassMat = new THREE.MeshBasicMaterial({ map: createGlassTexture() });

            // Hollow Outer Frame
            const frameSideGeo = new THREE.BoxGeometry(0.5, 8.5, 0.4);
            const frameTopGeo = new THREE.BoxGeometry(10.5, 0.5, 0.4);
            const outerL = new THREE.Mesh(frameSideGeo, frameMat); outerL.position.set(-5, 0, 0); doorGroup.add(outerL);
            const outerR = new THREE.Mesh(frameSideGeo, frameMat); outerR.position.set(5, 0, 0); doorGroup.add(outerR);
            const outerT = new THREE.Mesh(frameTopGeo, frameMat); outerT.position.set(0, 4, 0); doorGroup.add(outerT);
            const outerB = new THREE.Mesh(frameTopGeo, frameMat); outerB.position.set(0, -4, 0); doorGroup.add(outerB);

            // Glass Panel Geo
            const glassGeo = new THREE.BoxGeometry(4.6, 7.8, 0.1);
            const innerSideGeo = new THREE.BoxGeometry(0.2, 8, 0.2);
            const innerTopGeo = new THREE.BoxGeometry(5, 0.2, 0.2);
            const barGeo = new THREE.BoxGeometry(4.6, 0.1, 0.15);

            // Left Sliding Door
            const leftDoor = new THREE.Group();
            leftDoor.position.set(-2.4, -0.1, -0.05);
            leftDoor.add(new THREE.Mesh(glassGeo, glassMat));

            const lFrameL = new THREE.Mesh(innerSideGeo, frameMat); lFrameL.position.set(-2.4, 0, 0); leftDoor.add(lFrameL);
            const lFrameR = new THREE.Mesh(innerSideGeo, frameMat); lFrameR.position.set(2.4, 0, 0); leftDoor.add(lFrameR);

            // Simple semaphore to limit concurrent operations
            class Semaphore {
                constructor(max) {
                    this.max = max;
                    this.current = 0;
                    this.queue = [];
                }

                async acquire() {
                    if (this.current < this.max) {
                        this.current++;
                        return Promise.resolve();
                    }
                    return new Promise(resolve => this.queue.push(resolve));
                }

                release() {
                    this.current--;
                    if (this.queue.length > 0) {
                        this.current++;
                        this.queue.shift()();
                    }
                }
            }

            // Optimized for Cloudflare HTTP/2 multiplexing in production
            const textureSemaphore = new Semaphore(50);
            const textureCache = new Map();

            // Helper to fetch images and extract average color
            function loadTexture(itemId) {
                // Return the promise immediately if it's already in the cache
                if (textureCache.has(itemId)) {
                    return textureCache.get(itemId);
                }

                // Create the promise and store it in the cache BEFORE awaiting anything!
                // This prevents duplicate concurrent fetches for the same movie across different shelves.
                const promise = (async () => {
                    await textureSemaphore.acquire();

                    try {
                        const imgUrl = `${jfServer}/Items/${itemId}/Images/Primary?maxWidth=256&quality=80`;
                        const imgRes = await fetch(imgUrl, { headers: { 'X-Emby-Token': jfToken } });
                        if (!imgRes.ok) return null;
                        const blob = await imgRes.blob();
                        const bmp = await createImageBitmap(blob, { imageOrientation: 'flipY' });

                        const tex = new THREE.Texture(bmp);
                        tex.colorSpace = THREE.SRGBColorSpace;
                        tex.needsUpdate = true;

                        return { texture: tex, bitmap: bmp };
                    } catch (e) {
                        return null;
                    } finally {
                        textureSemaphore.release();
                    }
                })();

                textureCache.set(itemId, promise);
                return promise;
            }

            // Simple daily seeded PRNG (Mulberry32) so all users see the exact same store today!
            function mulberry32(a) {
                return function() {
                  var t = a += 0x6D2B79F5;
                  t = Math.imul(t ^ t >>> 15, t | 1);
                  t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                  return ((t ^ t >>> 14) >>> 0) / 4294967296;
                }
            }
            const todaySeed = Math.floor(Date.now() / 86400000); 

            // Start loading data in the background without blocking the render loop
            loadData().catch(e => console.error(e));

            backgroundSpineQueue = Array.from(movieMeshMap.values());

        }

        function processNextSpine() {
            if (backgroundSpineQueue.length === 0) {
                isProcessingSpines = false;
                return;
            }

            const caseGroup = backgroundSpineQueue.shift();
            
            if (caseGroup && caseGroup.userData) {
                const item = caseGroup.userData.item;
                const bitmap = caseGroup.userData.bitmap;
                if (bitmap) {
                    const tinyCanvas = document.createElement('canvas');
                    tinyCanvas.width = 16;
                    tinyCanvas.height = 16;
                    const tinyCtx = tinyCanvas.getContext('2d');
                    tinyCtx.drawImage(bitmap, 0, 0, 16, 16);
                    const pixels = tinyCtx.getImageData(0, 0, 16, 16).data;

                    let r = 0, g = 0, b = 0, count = 0;
                    for (let i = 0; i < pixels.length; i += 4) {
                        r += pixels[i]; g += pixels[i+1]; b += pixels[i+2]; count++;
                    }

                    const avgR = Math.floor(r / count);
                    const avgG = Math.floor(g / count);
                    const avgB = Math.floor(b / count);
                    const bgColor = `rgb(${avgR}, ${avgG}, ${avgB})`;

                    const luminance = 0.2126 * (avgR/255) + 0.7152 * (avgG/255) + 0.0722 * (avgB/255);
                    const isLight = luminance > 0.45;

                    const palette = {
                        bg: bgColor,
                        text: isLight ? '#111111' : '#ffffff',
                        subtext: isLight ? '#333333' : '#cccccc',
                        divider: isLight ? '#999999' : '#333333'
                    };

                    const vg = caseGroup.getObjectByName('visualGroup');
                    if (vg) {
                        const rightSpinePlane = vg.getObjectByName('right_spine');
                        if (rightSpinePlane && rightSpinePlane.material === defaultSpineMat) {
                            rightSpinePlane.material = rightSpinePlane.material.clone();
                            rightSpinePlane.material.color.set(palette.bg);
                            rightSpinePlane.material.needsUpdate = true;
                        }

                        const topPlane = vg.getObjectByName('top');
                        if (topPlane && topPlane.material === defaultSpineMat) {
                            topPlane.material = topPlane.material.clone();
                            topPlane.material.color.set(palette.bg);
                            topPlane.material.needsUpdate = true;
                        }

                        // The spine faces out, so generate a low-res spine texture for it
                        const spinePlane = vg.getObjectByName('spine');
                        if (spinePlane && spinePlane.material === defaultSpineMat) {
                            const spineTex = createSpineTexture(item, palette, STORE_DESIGN, true); // true = half scale!
                            spinePlane.material = spinePlane.material.clone();
                            spinePlane.material.map = spineTex;
                            spinePlane.material.color.setHex(0xffffff);
                            spinePlane.material.needsUpdate = true;
                        }
                    }
                    // caseGroup.userData.hasShelfColors = true; 
                    caseGroup.userData.palette = palette; // Save it for click() to use!
                }
            }

            requestAnimationFrame(processNextSpine);
        }

        async function loadData() {
            try {
                const extractItems = (d) => Array.isArray(d) ? d : (d.Items || []);
                const fields = 'Overview,RunTimeTicks,ProductionYear,OfficialRating,Genres,DateCreated';

                function shuffleArray(array, rngFunc) {
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(rngFunc() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                    return array;
                }

                // Fetch 15 distinct categories for our massive structures
                const categories = [
                    { name: 'Action', genre: 'Action', sort: 'SortName', randomizeWindow: true },
                    { name: 'Comedy', genre: 'Comedy', sort: 'SortName', randomizeWindow: true },
                    { name: 'Drama', genre: 'Drama', sort: 'SortName', randomizeWindow: true },
                    { name: 'Sci-Fi', genre: 'Sci-Fi', sort: 'SortName', randomizeWindow: true },
                    { name: 'Horror', genre: 'Horror', sort: 'SortName', randomizeWindow: true },
                    { name: 'Family', genre: 'Family', sort: 'SortName', randomizeWindow: true },
                    { name: 'Thriller', genre: 'Thriller', sort: 'SortName', randomizeWindow: true },
                    // Latest shouldn't use a random window, we want the actual newest movies!
                    { name: 'Latest', genre: null, sort: 'DateCreated', sortOrder: 'Descending', randomizeWindow: false },
                    { name: 'Suggestions', genre: null, sort: 'SortName', randomizeWindow: true },
                    { name: 'Fantasy', genre: 'Fantasy', sort: 'SortName', randomizeWindow: true },
                    { name: 'Romance', genre: 'Romance', sort: 'SortName', randomizeWindow: true },
                    { name: 'Crime', genre: 'Crime', sort: 'SortName', randomizeWindow: true },
                    { name: 'Adventure', genre: 'Adventure', sort: 'SortName', randomizeWindow: true },
                    { name: 'Animation', genre: 'Animation', sort: 'SortName', randomizeWindow: true },
                    { name: 'Mystery', genre: 'Mystery', sort: 'SortName', randomizeWindow: true }
                ];

                let lists = [];
                let manifest = null;
                
                try {
                    const mRes = await fetch('https://nathanbuster-production.up.railway.app/manifest');
                    const mData = await mRes.json();
                    if (mData && mData.seed === todaySeed && mData.lists) {
                        manifest = mData;
                    }
                } catch(e) {
                    window.logDebug("Manifest Fetch Error: " + e.message);
                    console.warn("Failed to fetch manifest", e);
                }

                const STORE_CACHE_VERSION = 3; // bump whenever layout/seed logic changes
                const cacheKey = `virtualStoreCache_v${STORE_CACHE_VERSION}_day${todaySeed}`;

                // Purge stale entries from old days / old code versions
                for (let i = sessionStorage.length - 1; i >= 0; i--) {
                    const k = sessionStorage.key(i);
                    if (k && k.startsWith('virtualStoreCache') && k !== cacheKey) sessionStorage.removeItem(k);
                }

                const cachedData = sessionStorage.getItem(cacheKey);

                if (manifest) {
                    console.log("[MANIFEST] Adopted server manifest!");
                    const byId = new Map();
                    const flat = manifest.lists.flat();
                    for (let i = 0; i < flat.length; i += 150) {
                        const chunk = flat.slice(i, i + 150);
                        const res = await fetch(`${jfServer}/Users/${jfUserId}/Items?Ids=${chunk.join(',')}&Fields=${fields}&Limit=150`,
                            { headers: { 'X-Emby-Token': jfToken } });
                        const json = await res.json();
                        extractItems(json).forEach(it => byId.set(it.Id, it));
                    }
                    lists = manifest.lists.map(ids => ids.map(id => byId.get(id)).filter(Boolean));
                    sessionStorage.setItem(cacheKey, JSON.stringify(lists)); // Cache the hydrated manifest
                } else if (cachedData) {
                    lists = JSON.parse(cachedData);
                } else {
                    const allMoviesUrl = `${jfServer}/Users/${jfUserId}/Items?Recursive=true&IncludeItemTypes=Movie&Fields=${fields}&Limit=5000&SortBy=SortName`;
                    const res = await fetch(allMoviesUrl, { headers: { 'X-Emby-Token': jfToken } });
                    const data = await res.json();
                    const allItems = extractItems(data);

                    lists = categories.map((cat, i) => {
                        const catRNG = mulberry32(todaySeed + i);
                        
                        let filtered = cat.genre 
                            ? allItems.filter(m => m.Genres && m.Genres.includes(cat.genre)) 
                            : [...allItems];
                            
                        if (filtered.length === 0) return [];

                        if (cat.name === 'Latest') {
                            filtered.sort((a, b) => new Date(b.DateCreated || 0) - new Date(a.DateCreated || 0));
                            return filtered.slice(0, 100);
                        }

                        const limit = Math.min(100, filtered.length);
                        const maxStart = Math.max(0, filtered.length - limit);
                        const startIndex = cat.randomizeWindow === false ? 0 : Math.floor(catRNG() * maxStart);
                        const windowed = filtered.slice(startIndex, startIndex + limit);
                        
                        return shuffleArray(windowed, catRNG);
                    });
                    sessionStorage.setItem(cacheKey, JSON.stringify(lists));
                    
                    // We need to send this to the server so it becomes the manifest!
                    const newManifest = {
                        seed: todaySeed,
                        lists: lists.map(l => l.map(m => m.Id))
                    };
                    if (typeof ws !== 'undefined' && ws && ws.readyState === WebSocket.OPEN) {
                        console.log("[MANIFEST] Broadcasting our newly computed layout to the server!");
                        ws.send(JSON.stringify({ type: 'SET_MANIFEST', payload: newManifest }));
                    } else {
                        window.pendingManifest = newManifest;
                    }
                }

                // Fallback list of all movies in case a genre is completely empty on their server
                const allMovies = lists.flat().filter(m => m !== undefined);

                // Progressive Rendering: Hide the loading screen immediately so the user can enter the room!
                // The physical gondolas will render instantly, and the movies will pop in as their textures finish loading.
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 500);

                                caseGroup.position.set(0, pedY, 0); // Sit on top of pedestal
                                caseGroup.rotation.x = -0.2; // Lean it back slightly
                                const pedRNG = mulberry32(todaySeed + hashStr(movie.Id));
                                caseGroup.rotation.y = (pedRNG() - 0.5) * 0.4; // Slightly organic rotation
                                const instanceId = 'pedestal_' + index + '_' + movie.Id;
                                movieMeshMap.set(instanceId, caseGroup);
                                if (networkHeldItems.has(instanceId)) caseGroup.visible = false;

                                const ud = { item: movie, bitmap: bmp, id: instanceId, title: movie.Name, isCase: true, originalPos: caseGroup.position.clone(), originalRot: caseGroup.rotation.clone() };
                                caseGroup.userData = ud;

                            const visualGroup = new THREE.Group();
                            visualGroup.name = 'visualGroup';
                            caseGroup.add(visualGroup);
                            
                            const hitBox = new THREE.Mesh(
                                sharedHitBoxGeo,
                                new THREE.MeshBasicMaterial({ visible: false })
                            );
                            hitBox.position.set(0, 0, 0);
                            hitBox.userData = { parentGroup: caseGroup };
                            caseGroup.add(hitBox);
                            interactableMeshes.push(hitBox);

                            const caseMesh = new THREE.Mesh(sharedCaseGeo, casePlasticMat);
                            caseMesh.userData = { parentGroup: caseGroup };
                            visualGroup.add(caseMesh);

                                const frontMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 1.0 }); // FULLY MATTE
                                const frontMesh = new THREE.Mesh(sharedFrontGeo, frontMat);
                                frontMesh.position.z = halfDepth + 0.001;
                                frontMesh.name = 'front';
                                frontMesh.userData = { parentGroup: caseGroup };
                                visualGroup.add(frontMesh);

                                // Add dummy planes for back and spine so the inspection generation has targets!
                                const backMesh = new THREE.Mesh(sharedBackGeo, sleeveMat);
                                backMesh.position.z = - (halfDepth + 0.001);
                                backMesh.rotation.y = Math.PI;
                                backMesh.name = 'back';
                                backMesh.userData = { parentGroup: caseGroup };
                                visualGroup.add(backMesh);

                                const spineMesh = new THREE.Mesh(sharedSpineGeo, sleeveMat);
                                spineMesh.position.x = - (halfWidth + 0.001);
                                spineMesh.rotation.y = -Math.PI / 2;
                                spineMesh.name = 'spine';
                                spineMesh.userData = { parentGroup: caseGroup };
                                visualGroup.add(spineMesh);

                                if (!isDvd) {
                                    const rightSpineMesh = new THREE.Mesh(sharedSpineGeo, sleeveMat);
                                    rightSpineMesh.position.x = halfWidth + 0.001;
                                    rightSpineMesh.rotation.y = Math.PI / 2;
                                    rightSpineMesh.name = 'right_spine';
                                    rightSpineMesh.userData = { parentGroup: caseGroup };
                                    visualGroup.add(rightSpineMesh);

                                    const topMesh = new THREE.Mesh(sharedTopGeo, sleeveMat);
                                    topMesh.position.y = halfHeight + 0.001;
                                    topMesh.rotation.x = -Math.PI / 2;
                                    topMesh.name = 'top';
                                    topMesh.userData = { parentGroup: caseGroup };
                                    visualGroup.add(topMesh);
                                }

                                

                                // Spotlight shining directly on this highlighted release from the ceiling
                                const spot = new THREE.SpotLight(0xfff0dd, 1.5); // Warm light, much softer intensity
                                spot.position.set(0, 16.5, 4); // Put it all the way up on the ceiling, firmly in front
                                spot.angle = Math.PI / 16; // Tighter beam
                                spot.penumbra = 0.8; // Softer edges
                                spot.decay = 2;
                                spot.distance = 30;

                                const target = new THREE.Object3D();
                                target.position.copy(caseGroup.position);
                                group.add(target);
                                spot.target = target;

                                group.add(spot);
                                group.add(caseGroup);
                            }).catch(e => console.error("Floor display error:", e));

                        scene.add(group);
                    });
                }
                // --- Build Wall Posters ---
                function buildWallPosters(movies) {
                    if (!movies || movies.length === 0) return;

                    const posterPositions = [
                        // Front Wall (Z = 32.3, looking back into the room -> rotate Math.PI)
                        { x: -25, z: 32.3, rotY: Math.PI }, // Shifted outwards to clear the door
                        { x: -15, z: 32.3, rotY: Math.PI },
                        { x: 15,  z: 32.3, rotY: Math.PI },
                        { x: 25,  z: 32.3, rotY: Math.PI },
                        // Side Walls (By the front door)
                        { x: -29.8, z: 27, rotY: Math.PI / 2 }, // Left Wall
                        { x: 29.8,  z: 27, rotY: -Math.PI / 2 } // Right Wall
                    ];

                    // Deterministically pick 6 movies
                    const selected = [];
                    const step = Math.max(1, Math.floor(movies.length / posterPositions.length));
                    for (let i = 0; i < posterPositions.length; i++) selected.push(movies[(i * step) % movies.length]);

                    const posterGeo = new THREE.PlaneGeometry(6, 9);
                    const frameGeo = new THREE.BoxGeometry(6.4, 9.4, 0.2);
                    const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });

                    selected.forEach((item, index) => {
                        const pos = posterPositions[index];
                        const group = new THREE.Group();
                        group.position.set(pos.x, 6.5, pos.z);
                        group.rotation.y = pos.rotY;

                        const frame = new THREE.Mesh(frameGeo, frameMat);
                        group.add(frame);

                        // Base color MUST be 0xffffff otherwise the loaded texture is multiplied by dark grey!
                        const posterMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
                        const poster = new THREE.Mesh(posterGeo, posterMat);
                        poster.position.z = 0.12;
                        group.add(poster);

                        // Add a subtle gallery SpotLight pointing down at the poster!
                        const light = new THREE.SpotLight(0xffeedd, 1.2, 15, Math.PI / 4, 0.8, 1);
                        light.position.set(0, 6, 3); // High up and slightly out from the wall

                        // SpotLights need a target to point at
                        const targetObj = new THREE.Object3D();
                        targetObj.position.set(0, 0, 0); // Point exactly at the center of the poster
                        group.add(targetObj);

                        light.target = targetObj;
                        group.add(light);

                        scene.add(group);

                        const imgUrl = `${jfServer}/Items/${item.Id}/Images/Primary?maxWidth=1024&quality=90`;
                        fetch(imgUrl, { headers: { 'X-Emby-Token': jfToken } })
                            .then(res => res.blob())
                            .then(blob => createImageBitmap(blob, { imageOrientation: 'flipY' }))
                            .then(bmp => {
                                const tex = new THREE.CanvasTexture(bmp);
                            tex.colorSpace = THREE.SRGBColorSpace;
                                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                                poster.material.map = tex;
                                poster.material.needsUpdate = true;
                            }).catch(e => console.error(e));
                    });
                }

                // The "Back-to-Back E" layout
                // We order these by proximity to the camera (Z=14) so the semaphore prioritizes the closest movies!
                await Promise.all([
                    // Front Gondolas (Closest)
                    buildGondola(lists[5], { x: -13, z: 12 }, 0, 14, true, 3, allMovies, categories[5].name, lists[11], categories[11].name),
                    buildGondola(lists[8], { x: 13, z: 12 }, 0, 14, true, 3, allMovies, categories[8].name, lists[14], categories[14].name),

                    // Middle Gondolas
                    buildGondola(lists[4], { x: -13, z: -2 }, 0, 14, true, 3, allMovies, categories[4].name, lists[10], categories[10].name),
                    buildGondola(lists[7], { x: 13, z: -2 }, 0, 14, true, 3, allMovies, categories[7].name, lists[13], categories[13].name),

                    // Back Gondolas
                    buildGondola(lists[3], { x: -13, z: -16 }, 0, 14, true, 3, allMovies, categories[3].name, lists[9], categories[9].name),
                    buildGondola(lists[6], { x: 13, z: -16 }, 0, 14, true, 3, allMovies, categories[6].name, lists[12], categories[12].name),

                    // Outer Walls
                    buildGondola(lists[0], { x: -27, z: -5 }, Math.PI / 2, 50, false, 5, allMovies, categories[0].name), // Left Wall
                    buildGondola(lists[1], { x: 27, z: -5 }, -Math.PI / 2, 50, false, 5, allMovies, categories[1].name), // Right Wall
                    buildGondola(lists[2], { x: 0, z: -30 }, 0, 50, false, 5, allMovies, categories[2].name) // Back Wall
                ]);

                // Build posters AFTER all gondolas finish loading so it doesn't steal network bandwidth!
                buildWallPosters(allMovies);
                buildWelcomeMat();
                buildFloorDisplays(allMovies);
                // buildCheckoutCounter();
                
                // Start lazy loading shelf colors/spines in the background
                setTimeout(startBackgroundSpineProcessing, 1000); // 1s delay so browser breathes
            } catch (e) {
                window.logDebug("loadData Error: " + e.message + "\n" + e.stack);
                console.error("Failed to load store data", e);
                loadingScreen.innerText = "Error loading store.";
            }
        }

        // Builds a shelving unit. Double-sided for center gondolas, single-sided for walls.
        async function buildGondola(itemsFront, position, rotationY, length = 20, isDoubleSided = false, shelfCount = 3, fallbackItems = null, labelFront = null, itemsBack = null, labelBack = null) {
            if (!itemsFront || !itemsFront.length) itemsFront = fallbackItems;
            if (isDoubleSided && (!itemsBack || !itemsBack.length)) itemsBack = fallbackItems;
            if (!itemsFront || !itemsFront.length) return;

            const gondola = new THREE.Group();
            gondola.position.set(position.x, 0, position.z);
            gondola.rotation.y = rotationY;
            scene.add(gondola);

            function createSignTexture(text) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#4b0082'; // Purple
                ctx.fillRect(0, 0, 1024, 256);
                ctx.strokeStyle = '#FDDA0D'; // Yellow border
                ctx.lineWidth = 16;
                ctx.strokeRect(8, 8, 1008, 240);
                ctx.fillStyle = '#FDDA0D';
                ctx.font = 'italic bold 100px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text.toUpperCase(), 512, 128);
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            if (labelFront) {
                const signMatFront = new THREE.MeshBasicMaterial({ map: createSignTexture(labelFront) });
                const signMatBack = labelBack ? new THREE.MeshBasicMaterial({ map: createSignTexture(labelBack) }) : signMatFront;
                const edgeMat = new THREE.MeshBasicMaterial({ color: 0xFDDA0D });

                // Materials: Right, Left, Top, Bottom, Front (+Z), Back (-Z)
                const signMats = [edgeMat, edgeMat, edgeMat, edgeMat, signMatFront, signMatBack];

                const signGeo = new THREE.BoxGeometry(6, 1.5, 0.1);
                const sign = new THREE.Mesh(signGeo, signMats);

                sign.position.set(0, shelfCount * 2 + 1.5, 0);

                const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 1);
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
                const pole1 = new THREE.Mesh(poleGeo, poleMat);
                pole1.position.set(-2, shelfCount * 2 + 0.5, 0);
                const pole2 = new THREE.Mesh(poleGeo, poleMat);
                pole2.position.set(2, shelfCount * 2 + 0.5, 0);

                gondola.add(sign);
                gondola.add(pole1);
                gondola.add(pole2);
            }

            // Backboard
            // Classic Blockbuster Beige/Cream Pegboard Metal
            function createPegboardTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#9e998a'; // Darkened to a drab industrial grey/beige
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#222222';
                // Draw 4 peg holes
                ctx.beginPath(); ctx.arc(32, 32, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(96, 32, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(32, 96, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(96, 96, 5, 0, Math.PI*2); ctx.fill();

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
                // Repeat density based on physical wall size
                tex.repeat.set(length * 2, (shelfCount * 2 + 2) * 2);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                return tex;
            }

            const backMat = new THREE.MeshStandardMaterial({ map: createPegboardTexture(), roughness: 0.8, metalness: 0.1 });
            const backGeo = new THREE.BoxGeometry(length, shelfCount * 2 + 2, 0.5);
            const back = new THREE.Mesh(backGeo, backMat);
            back.position.set(0, shelfCount - 0.5, 0); // Centered height
            back.userData = { isShelf: true };
            gondola.add(back);
            interactableMeshes.push(back);

            // (Soft bevelled clamshell shape and materials now globally shared)

            // Create a classic "BE KIND REWIND" rental sticker to slap on random movies
            function createStickerTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffcc00'; // Yellow border
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#0000aa'; // Blue inner border
                ctx.fillRect(5, 5, 118, 118);
                ctx.fillStyle = '#ffcc00'; // Yellow center
                ctx.fillRect(10, 10, 108, 108);

                ctx.fillStyle = '#0000aa';
                ctx.font = 'bold 20px "Helvetica", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('BE KIND', 64, 55);
                ctx.fillText('PLEASE', 64, 80);
                ctx.fillText('REWIND', 64, 105);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }
            const stickerMat = new THREE.MeshStandardMaterial({ map: createStickerTexture(), roughness: 0.5, transparent: true, depthWrite: false });
            const stickerGeo = new THREE.PlaneGeometry(0.35, 0.35);

            // Classic Blockbuster Shelf Metal
            const solidMat = new THREE.MeshStandardMaterial({ color: 0x8c8779, roughness: 0.6, metalness: 0.3 });

            const itemsPerShelf = Math.floor(length / 1.5);
            const sides = isDoubleSided ? [1, -1] : [1]; // 1 = Front side (+Z), -1 = Back side (-Z)
            const shelfPromises = [];

            for (const side of sides) {
                const sideItems = side === 1 ? itemsFront : itemsBack;
                if (!sideItems || !sideItems.length) continue;

                // We start at 0 instead of a random index! The array is ALREADY shuffled by loadData().
                // If we pick a random index here, returning from BFCache will pick 30 DIFFERENT movies
                // out of the 100 cached items, defeating the image cache!
                let itemIndex = 0;

                for (let s = 0; s < shelfCount; s++) {
                    const shelfHeight = 0.5 + s * 2;
                    const plankGeo = new THREE.BoxGeometry(length, 0.1, 1.2);
                    const plank = new THREE.Mesh(plankGeo, solidMat);
                    plank.position.set(0, shelfHeight - 0.75, side * 0.6);
                    gondola.add(plank);

                    // Blockbuster Blue Plastic Ticket Rail
                    const railGeo = new THREE.BoxGeometry(length, 0.15, 0.05);
                    const railMat = new THREE.MeshStandardMaterial({ color: 0x0000aa, roughness: 0.3, metalness: 0.1 });
                    const rail = new THREE.Mesh(railGeo, railMat);
                    // 0.6 is the center of the plank (which is 1.2 deep). So +0.6 gets us to the front edge.
                    rail.position.set(0, shelfHeight - 0.75, side * (0.6 + 0.6 + 0.025));
                    gondola.add(rail);

                    const shelfItems = [];
                    for (let i = 0; i < itemsPerShelf; i++) {
                        shelfItems.push(sideItems[itemIndex % sideItems.length]);
                        itemIndex++;
                    }

                    const shelfGroups = []; // Dedicated array for THIS specific shelf

                    // Parallelize image fetching for this shelf
                    const buildShelfItems = async () => {
                        const itemPromises = shelfItems.map(async (item, i) => {
                            const texData = await loadTexture(item.Id);

                            // Use shared fallback material if texture failed to load (roughness 0.8 for cardboard VHS look)
                            let frontMat = texData ? new THREE.MeshStandardMaterial({ map: texData.texture, roughness: 0.8 }) : fallbackFrontMat;
                            let sleeveMat = defaultSpineMat;

                            const caseGroup = new THREE.Group();

                            const xPos = (i - shelfItems.length / 2) * 1.5 + 0.75;
                            caseGroup.position.set(xPos, shelfHeight + gondolaYOffset, side * 0.8);
                            if (side === -1) {
                                caseGroup.rotation.y = Math.PI;
                                caseGroup.rotation.x = 0.1;
                            } else {
                                caseGroup.rotation.x = -0.1;
                            }

                            // position.x, position.z, side, shelf index (s), and item index guarantee absolute uniqueness
                            const instanceId = 'gondola_' + position.x + '_' + position.z + '_' + side + '_' + s + '_' + i + '_' + item.Id;
                            movieMeshMap.set(instanceId, caseGroup);
                            if (networkHeldItems.has(instanceId)) caseGroup.visible = false;

                            const ud = { item: item, bitmap: texData ? texData.bitmap : null, id: instanceId, title: item.Name, isCase: true, originalPos: caseGroup.position.clone(), originalRot: caseGroup.rotation.clone() };
                            caseGroup.userData = ud;

                            // 1. Puffy Black Plastic Case
                            const visualGroup = new THREE.Group();
                            visualGroup.name = 'visualGroup';
                            caseGroup.add(visualGroup);
                            
                            const hitBox = new THREE.Mesh(
                                sharedHitBoxGeo,
                                new THREE.MeshBasicMaterial({ visible: false })
                            );
                            hitBox.position.set(0, 0, 0);
                            hitBox.userData = { parentGroup: caseGroup };
                            caseGroup.add(hitBox);
                            interactableMeshes.push(hitBox);

                            const caseMesh = new THREE.Mesh(sharedCaseGeo, casePlasticMat);
                            caseMesh.userData = { parentGroup: caseGroup };
                            visualGroup.add(caseMesh);

                            // 2. Front Poster Plane (slightly inset)
                            const frontMesh = new THREE.Mesh(sharedFrontGeo, frontMat);
                            frontMesh.position.z = halfDepth + 0.001;
                            frontMesh.name = 'front';
                            frontMesh.userData = { parentGroup: caseGroup };
                            visualGroup.add(frontMesh);

                            // 3. Back Cover Plane
                            const backMesh = new THREE.Mesh(sharedBackGeo, sleeveMat);
                            backMesh.position.z = - (halfDepth + 0.001);
                            backMesh.rotation.y = Math.PI;
                            backMesh.name = 'back';
                            backMesh.userData = { parentGroup: caseGroup };
                            visualGroup.add(backMesh);

                            // 4. Spine Plane
                            const spineMesh = new THREE.Mesh(sharedSpineGeo, sleeveMat);
                            spineMesh.position.x = - (halfWidth + 0.001);
                            spineMesh.rotation.y = -Math.PI / 2;
                            spineMesh.name = 'spine';
                            spineMesh.userData = { parentGroup: caseGroup };
                            visualGroup.add(spineMesh);

                            if (!isDvd) {
                                const rightSpineMesh = new THREE.Mesh(sharedSpineGeo, sleeveMat);
                                rightSpineMesh.position.x = halfWidth + 0.001;
                                rightSpineMesh.rotation.y = Math.PI / 2;
                                rightSpineMesh.name = 'right_spine';
                                rightSpineMesh.userData = { parentGroup: caseGroup };
                                visualGroup.add(rightSpineMesh);

                                const topMesh = new THREE.Mesh(sharedTopGeo, sleeveMat);
                                topMesh.position.y = halfHeight + 0.001;
                                topMesh.rotation.x = -Math.PI / 2;
                                topMesh.name = 'top';
                                topMesh.userData = { parentGroup: caseGroup };
                                visualGroup.add(topMesh);
                            }
                            
                            

                            // 5. 30% chance to have a "BE KIND REWIND" sticker!
                            const slotRNG = mulberry32(todaySeed + hashStr(item.Id));
                            if (STORE_DESIGN === 'vhs' && slotRNG() < 0.3) {
                                const sticker = new THREE.Mesh(stickerGeo, stickerMat);
                                sticker.position.set(0.2, -0.4, halfDepth + 0.002);
                                sticker.rotation.z = (slotRNG() - 0.5) * 0.4;
                                sticker.userData = { parentGroup: caseGroup };
                                visualGroup.add(sticker);
                            }

                            gondola.add(caseGroup);

                            // Track movie groups for the hitbox instead of pushing individual meshes
                            shelfGroups.push(caseGroup);
                        });
                        await Promise.all(itemPromises);
                    };
                    shelfPromises.push(buildShelfItems());

                    // Hitbox removed
                }
            }

            await Promise.all(shelfPromises);
        }

            // --- Navigation Nodes (Predetermined Standing Spots) ---
            const nodes = [];

            // Create a texture that looks like a ring, but applied to a solid plane so the whole square is clickable
            const nodeCanvas = document.createElement('canvas');
            nodeCanvas.width = 128;
            nodeCanvas.height = 128;
            const nodeCtx = nodeCanvas.getContext('2d');

            // Faint dark circle background for better visibility
            nodeCtx.fillStyle = 'rgba(0,0,0,0.4)';
            nodeCtx.beginPath();
            nodeCtx.arc(64, 64, 60, 0, Math.PI * 2);
            nodeCtx.fill();

            nodeCtx.strokeStyle = '#ffffff';
            nodeCtx.lineWidth = 10;
            nodeCtx.beginPath();
            nodeCtx.arc(64, 64, 48, 0, Math.PI * 2);
            nodeCtx.stroke();
            const nodeTex = new THREE.CanvasTexture(nodeCanvas);

            const nodeGeo = new THREE.PlaneGeometry(5, 5); // 5x5 clickable area
            nodeGeo.rotateX(-Math.PI / 2);

            const nodePositions = [
                // Front aisle (Z = 19)
                {x: -20, z: 19}, {x: -13, z: 19}, {x: 0, z: 19}, {x: 13, z: 19}, {x: 20, z: 19},
                // Middle aisle 1 (Z = 5)
                {x: -20, z: 5}, {x: -13, z: 5}, {x: 0, z: 5}, {x: 13, z: 5}, {x: 20, z: 5},
                // Middle aisle 2 (Z = -9)
                {x: -20, z: -9}, {x: -13, z: -9}, {x: 0, z: -9}, {x: 13, z: -9}, {x: 20, z: -9},
                // Back aisle (Z = -23)
                {x: -20, z: -23}, {x: -13, z: -23}, {x: 0, z: -23}, {x: 13, z: -23}, {x: 20, z: -23}
            ];

            for (let pos of nodePositions) {
                const nodeMat = new THREE.MeshBasicMaterial({ map: nodeTex, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                node.position.set(pos.x, -1.48, pos.z);
                node.userData = { isNode: true, targetX: pos.x, targetZ: pos.z };
                scene.add(node);
                interactableMeshes.push(node);
                nodes.push(node);
            }

            let targetCameraX = 0;
            let currentCameraX = 0;
            let targetCameraZ = 14;
            let currentCameraZ = 14;
            let targetFov = 60;

            // Camera Rotation (Gyroscopic/Drag)
            let cameraYaw = 0;
            let cameraPitch = -0.3; // Start with a downward tilt to look at the shelves from above
            camera.rotation.order = 'YXZ'; // Important for FPS-style rotation
            camera.rotation.y = cameraYaw;
            camera.rotation.x = cameraPitch;
            // --- Multiplayer Networking (Phase 1) ---
            const networkedPlayers = new Map();
            // Globals ws, myUsername, networkHeldItems already defined at top of file

            function createAvatar(username, userId) {
                const group = new THREE.Group();
                
                // Retro TV Case (Beige)
                const tvGeo = new THREE.BoxGeometry(1.6, 1.2, 1.6);
                const tvMat = new THREE.MeshStandardMaterial({ color: 0xdcd9d0, roughness: 0.8 });
                const tv = new THREE.Mesh(tvGeo, tvMat);
                tv.position.y = 7.9; 
                group.add(tv);
                
                // Glass Screen (Black/Glossy)
                const screenGeo = new THREE.PlaneGeometry(1.28, 0.88);
                const screenMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.05, metalness: 0.8 });
                const screen = new THREE.Mesh(screenGeo, screenMat);
                screen.position.set(0, 7.9, -0.801);
                screen.rotation.y = Math.PI;
                group.add(screen);

                // Static/Noise image for the screen
                const canvasStatic = document.createElement('canvas');
                canvasStatic.width = 64; canvasStatic.height = 64;
                const ctxS = canvasStatic.getContext('2d');
                const imgData = ctxS.createImageData(64, 64);
                for (let i = 0; i < imgData.data.length; i += 4) {
                    const c = Math.random() > 0.5 ? 34 : 85; 
                    imgData.data[i] = c; imgData.data[i+1] = c; imgData.data[i+2] = c; imgData.data[i+3] = 255;
                }
                ctxS.putImageData(imgData, 0, 0);
                const staticTex = new THREE.CanvasTexture(canvasStatic);
                const staticGeo = new THREE.PlaneGeometry(1.2, 0.8);
                const staticMat = new THREE.MeshBasicMaterial({ map: staticTex });
                const staticScreen = new THREE.Mesh(staticGeo, staticMat);
                staticScreen.position.set(0, 7.9, -0.802);
                staticScreen.rotation.y = Math.PI;
                group.add(staticScreen);
                if (userId && jfServer && jfToken) {
                    const imgUrl = `${jfServer}/Users/${userId}/Images/Primary?quality=90`;
                    fetch(imgUrl, { headers: { 'X-Emby-Token': jfToken } })
                        .then(res => {
                            if (!res.ok) throw new Error('No avatar');
                            return res.blob();
                        })
                        .then(blob => createImageBitmap(blob, { imageOrientation: 'flipY' }))
                        .then(bmp => {
                            const tex = new THREE.CanvasTexture(bmp);
                            staticTex.dispose();
                            staticScreen.material.map = tex;
                            staticScreen.material.needsUpdate = true;
                        })
                        .catch(err => {
                            // Keep static
                        });
                }

                // Rabbit Ear Antennas (Left & Right)
                const antGeo = new THREE.CylinderGeometry(0.02, 0.04, 1.0, 8);
                const antMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.3 });
                
                const antLeft = new THREE.Mesh(antGeo, antMat);
                antLeft.position.set(-0.4, 8.7, 0);
                antLeft.rotation.z = 0.5;
                group.add(antLeft);

                const antRight = new THREE.Mesh(antGeo, antMat);
                antRight.position.set(0.4, 8.7, 0);
                antRight.rotation.z = -0.5;
                group.add(antRight);

                // Username Sprite
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.roundRect(0, 0, 512, 128, 64);
                ctx.fill();
                ctx.font = 'bold 64px "Helvetica", sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(username, 256, 64);
                
                const tex = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: tex });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.y = 9.5;
                sprite.scale.set(3.0, 0.75, 1);
                group.add(sprite);

                scene.add(group);
                return group;
            }

            let wsRetryDelay = 1000;
            let wsIntentionallyClosed = false;

            function connectWS() {
                    if (STORE_MODE === 'singleplayer') return;
                try {
                    // Connect to live Railway multiplayer server!
                    ws = new WebSocket('wss://nathanbuster-production.up.railway.app');
                    window.logDebug("WS constructor called!");
                    
                    ws.onopen = () => {
                        wsRetryDelay = 1000;
                    window.logDebug("WS OPENED successfully!");
                    console.log("Connected to Multiplayer Server!");
                    ws.send(JSON.stringify({
                        type: 'JOIN',
                        payload: { username: myUsername, userId: jfUserId, x: currentCameraX, z: currentCameraZ, rotY: cameraYaw }
                    }));

                    if (window.pendingManifest) {
                        window.logDebug("[MANIFEST] Broadcasting our layout!");
                        console.log("[MANIFEST] Broadcasting our layout to the server!");
                        ws.send(JSON.stringify({
                            type: 'SET_MANIFEST',
                            payload: window.pendingManifest
                        }));
                        window.pendingManifest = null;
                    }
                };
                
                ws.onerror = (e) => window.logDebug("WS ERROR");
                ws.onclose = (e) => {
                    window.logDebug("WS CLOSED: " + e.code);
                    // Unlock all movies and hide avatars on disconnect
                    networkHeldItems.forEach(id => {
                        const group = movieMeshMap.get(id);
                        if (group) group.visible = true;
                    });
                    networkHeldItems.clear();
                    networkedPlayers.forEach(p => {
                        // Dispose dummy case materials
                        const dummyGroups = p.mesh.children.filter(c => c.name && c.name.startsWith("held_item_"));
                        dummyGroups.forEach(dummyGroup => {
                            const frontMesh = dummyGroup.children.find(c => c.name === 'front');
                            if (frontMesh && frontMesh.userData && frontMesh.userData.isDynamicFront && frontMesh.material) {
                                if (frontMesh.material.map) frontMesh.material.map.dispose();
                                frontMesh.material.dispose();
                            }
                            dummyGroup.children.forEach(child => {
                                if (child.material && child.material.userData && child.material.userData.isDynamicSleeve) {
                                    if (child.material.map) child.material.map.dispose();
                                    child.material.dispose();
                                }
                            });
                        });
                        scene.remove(p.mesh);
                    });
                    networkedPlayers.clear();

                    if (!wsIntentionallyClosed) {
                        setTimeout(connectWS, wsRetryDelay);
                        wsRetryDelay = Math.min(wsRetryDelay * 2, 15000);
                    }
                };

                function applyInspect(playerId, itemId) {
                    const p = networkedPlayers.get(playerId);
                    if (!p) return;
                    
                    networkHeldItems.add(itemId);
                    
                    // Hide the physical movie on the shelf using map
                    let group = movieMeshMap.get(itemId);
                    if (!group) {
                        for (const g of movieMeshMap.values()) {
                            if (g.userData && g.userData.item && g.userData.item.Id === itemId) {
                                group = g;
                                break;
                            }
                        }
                    }
                    if (group) group.visible = false;
                    
                    // Build a dummy case to attach to their avatar!
                    const dummyGroup = new THREE.Group();
                    dummyGroup.name = "held_item_" + itemId;
                    
                    const caseMesh = new THREE.Mesh(sharedCaseGeo, casePlasticMat);
                    dummyGroup.add(caseMesh);
                    
                    let sourceFrontMat = null;
                    let sourceSleeveMat = null;

                    if (group) {
                        const vg = group.getObjectByName('visualGroup') || group;
                        const originalFront = vg.children.find(c => c.name === 'front');
                        const originalBack = vg.children.find(c => c.name === 'back');
                        if (originalFront && originalFront.material) sourceFrontMat = originalFront.material;
                        if (originalBack && originalBack.material) sourceSleeveMat = originalBack.material;

                        // Create high-res textures for the dummy if they don't exist yet!
                        const item = group.userData.item;
                        if (item) {
                            let palette = group.userData.palette;
                            if (!palette && group.userData.bitmap) {
                                const b = group.userData.bitmap;
                                const tinyCanvas = document.createElement('canvas');
